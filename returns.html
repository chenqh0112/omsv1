<div class="modal-overlay" id="return-action-modal" role="dialog" aria-modal="true" aria-labelledby="return-action-title"><div class="modal return-action-modal"><div class="modal-head"><h3 id="return-action-title">审核退货申请</h3><button class="close" id="return-action-close" type="button" aria-label="关闭">&times;</button></div><div class="modal-body"><div class="return-action-summary" id="return-action-summary"></div><div class="return-rule-alert" id="return-action-rules"></div><fieldset class="return-review-group"><legend><em>*</em> 收货后处理方式</legend><div class="return-review-options"><label class="return-review-option"><input type="radio" name="return-disposition" value="等仓库收货后再选择" checked><span><strong>等仓库收货后再选择</strong><small>仓库完成收货并上传外箱照片后，您可查看外箱情况，再选择入库或销毁</small></span></label><label class="return-review-option"><input type="radio" name="return-disposition" value="仓库收货后直接入库"><span><strong>仓库收货后直接入库</strong><small>无需卖家再次选择，仓库收货后直接入库</small></span></label><label class="return-review-option"><input type="radio" name="return-disposition" value="仓库收货后直接销毁"><span><strong>仓库收货后直接销毁</strong><small>无需卖家再次选择，仓库收货后直接销毁</small></span></label></div></fieldset><fieldset class="return-review-group"><legend>增值作业 <span>可选</span></legend><div class="return-addon-options"><label><input id="return-addon-inspection" type="checkbox" value="申请拆箱质检"><span>申请拆箱质检</span></label><label><input id="return-addon-repack" type="checkbox" value="申请换箱"><span>申请换箱</span></label></div></fieldset><div class="manage-form-field return-review-note"><label for="return-review-note">审核备注</label><textarea id="return-review-note" rows="2" placeholder="通过时选填，拒绝时必填"></textarea></div></div><div class="modal-footer"><button class="btn btn-danger" id="return-action-reject" type="button">拒绝申请</button><span class="modal-footer-spacer"></span><button class="btn btn-ghost" id="return-action-cancel" type="button">取消</button><button class="btn btn-primary" id="return-action-confirm" type="button">审核通过</button></div></div></div>
<div class="modal-overlay" id="return-detail-modal" role="dialog" aria-modal="true" aria-labelledby="return-detail-title"><div class="modal return-detail-modal"><div class="modal-head"><h3 id="return-detail-title">退货详情</h3><button class="close" id="return-detail-close" type="button" aria-label="关闭退货详情">&times;</button></div><div class="modal-body" id="return-detail-content"></div><div class="modal-footer"><button class="btn btn-primary" id="return-detail-confirm" type="button">关闭</button></div></div></div>

<script>
var returnStatuses=['待人工审核','自动通过','人工通过','已拒绝'];
var returnReasons=['质量问题','错发','买家拒收','多退'];
var returnDispositions=['等仓库收货后再选择','仓库收货后直接入库','仓库收货后直接销毁'];
var returnData=[];var returnOrders=window.OMS_ORDER_DATA||[];var returnFiltered=[];var returnPage=1;var returnPageSize=8;var returnAction={id:''};
function returnEscape(value){return String(value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}function returnMoney(value){return '$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function findReturn(id){return returnData.find(function(item){return item.id===id})}
function returnQuantity(item){return (item.items||[]).reduce(function(sum,row){return sum+Number(row.quantity||0)},0)}
function returnOrder(item){return returnOrders.find(function(order){return order.id===item.orderId})}
function returnOrderedQuantity(item){if(item.orderedQuantity)return Number(item.orderedQuantity);var order=returnOrder(item);if(!order)return 0;return (item.items||[]).reduce(function(sum,row){var source=order.items.find(function(orderItem){return orderItem.sku===row.sku});return sum+Number(source?source.quantity:0)},0)}
function evaluateReturnRules(item){var hits=[];var quantity=returnQuantity(item);var orderedQuantity=returnOrderedQuantity(item);if(Number(item.amount||0)>1000)hits.push('退货金额超过 $1,000');if(quantity>20)hits.push('退货数量超过 20 件');if(orderedQuantity>0&&quantity/orderedQuantity>.3)hits.push('退货数量超过原购买数量的 30%');if(item.reason==='质量问题'||item.reason==='错发')hits.push('退货原因为'+item.reason);if(item.isFirstReturn)hits.push('用户首次申请退货');if(Number(item.recentReturnCount||0)>=3)hits.push('用户近 30 天退货达到 3 次');if(item.outOfReturnWindow)hits.push('申请已超过退货期限');if(item.duplicateRequest)hits.push('疑似重复退货申请');if(item.omsSyncFailed)hits.push('OMS 数据校验或同步失败');return hits}
function applyAutomaticReview(item){item.ruleHits=evaluateReturnRules(item);item.addons=item.addons||[];item.reviewNote=item.reviewNote||'';item.rejectionReason=item.rejectionReason||'';if(item.ruleHits.length){item.status='待人工审核';item.reviewMethod='规则触发人工审核';item.disposition='';item.addons=[];item.reviewedAt='';item.reviewedBy='';item.omsProgressStep=1}else{item.status='自动通过';item.reviewMethod='系统自动审核';item.disposition='等仓库收货后再选择';item.addons=[];item.reviewedAt=item.createdAt+' 00:01';item.reviewedBy='系统规则';item.omsProgressStep=Math.max(2,Number(item.omsProgressStep||2))}return item}
function applyMockReviewOutcome(item,index){if(item.status!=='待人工审核')return item;if(index%9===1){item.status='人工通过';item.reviewMethod='运营人工审核';item.disposition=returnDispositions[index%returnDispositions.length];item.addons=index%2===0?['申请拆箱质检']:[];item.reviewedAt=item.createdAt+' 14:30';item.reviewedBy='运营A';item.reviewNote='风险信息已核实，允许退货';item.omsProgressStep=2+index%3}else if(index%14===2){item.status='已拒绝';item.reviewMethod='运营人工审核';item.rejectionReason='退货数量与原订单不一致';item.reviewedAt=item.createdAt+' 16:10';item.reviewedBy='运营A';item.omsProgressStep=2}return item}
for(var returnIndex=0;returnIndex<31;returnIndex++){var order=returnOrders[returnIndex%returnOrders.length];var sourceItem=order.items[0];var returnedQuantity=1+returnIndex%6;var returnNo='RET-202608-'+String(1031-returnIndex).padStart(4,'0');var mockReturn={id:returnNo,idempotencyKey:returnNo,userId:order.userId,orderId:order.id,userName:order.userName,items:[{sku:sourceItem.sku,name:sourceItem.name,spec:sourceItem.spec,img:sourceItem.img,quantity:returnedQuantity}],reason:returnReasons[returnIndex%returnReasons.length],amount:Number((sourceItem.unitPrice*returnedQuantity).toFixed(2)),createdAt:'2026-08-'+String(28-returnIndex%27).padStart(2,'0'),orderedQuantity:returnIndex%10===2?returnedQuantity:returnedQuantity*4,isFirstReturn:returnIndex%13===5,recentReturnCount:returnIndex%11===4?3:0,outOfReturnWindow:returnIndex%17===8,duplicateRequest:returnIndex%19===10,omsSyncFailed:returnIndex%23===12,retryRecords:[],failureReason:''};returnData.push(applyMockReviewOutcome(applyAutomaticReview(mockReturn),returnIndex))}
try{var savedReturns=JSON.parse(localStorage.getItem('oms-return-requests')||'[]');savedReturns.forEach(function(item){if(!returnData.some(function(row){return row.id===item.id}))returnData.unshift(applyAutomaticReview(item))})}catch(error){}
function returnStatusClass(status){return 'return-status-'+({'待人工审核':'reviewing','自动通过':'automatic','人工通过':'reviewed','已拒绝':'rejected'}[status]||'reviewing')}
function returnItemSummary(item){var total=returnQuantity(item);return '<div class="return-sku-cell"><img src="'+returnEscape(item.items[0].img)+'" alt=""><span><strong>'+returnEscape(item.items[0].name)+'</strong><small>'+item.items.length+' 个SKU / '+total+' 件</small></span></div>'}
function returnActions(item){return '<div class="table-actions">'+(item.status==='待人工审核'?'<button class="btn-link" type="button" data-return-review="'+item.id+'">审核</button>':'')+'<button class="btn-link" type="button" data-return-detail="'+item.id+'">详情</button></div>'}
function returnInstruction(item){if(item.status==='已拒绝')return '<span class="muted-text">不适用</span>';return item.disposition?'<span class="return-instruction">'+returnEscape(item.disposition)+'</span>':'<span class="muted-text">人工审核后确定</span>'}
function returnAddons(values){return values&&values.length?'<div class="return-addon-tags">'+values.map(function(value){return '<span>'+returnEscape(value)+'</span>'}).join('')+'</div>':'<span class="muted-text">无</span>'}
function returnRuleTags(item){return item.ruleHits&&item.ruleHits.length?'<div class="return-rule-tags">'+item.ruleHits.map(function(rule){return '<span>'+returnEscape(rule)+'</span>'}).join('')+'</div>':'<span class="return-rule-clear">未命中风险规则</span>'}
function updateReturnStats(){var pendingReturns=returnData.filter(function(item){return item.status==='待人工审核'});document.getElementById('return-stat-pending').textContent=pendingReturns.length;document.getElementById('return-stat-items').textContent=pendingReturns.reduce(function(sum,item){return sum+returnQuantity(item)},0);document.getElementById('return-stat-month').textContent=returnData.filter(function(item){return item.createdAt.indexOf('2026-08')===0}).length;document.getElementById('return-stat-amount').textContent=returnMoney(returnData.filter(function(item){return item.createdAt.indexOf('2026-08')===0}).reduce(function(sum,item){return sum+item.amount},0))}
function renderReturns(){var pages=Math.max(1,Math.ceil(returnFiltered.length/returnPageSize));returnPage=Math.min(returnPage,pages);var pageData=returnFiltered.slice((returnPage-1)*returnPageSize,returnPage*returnPageSize);document.getElementById('return-tbody').innerHTML=pageData.length?pageData.map(function(item){return '<tr><td><code class="return-id">'+item.id+'</code></td><td><code>'+item.orderId+'</code></td><td class="return-user-name"><strong>'+returnEscape(item.userName)+'</strong></td><td>'+returnItemSummary(item)+'</td><td>'+item.reason+'</td><td><span class="return-status '+returnStatusClass(item.status)+'">'+item.status+'</span></td><td>'+returnInstruction(item)+'</td><td>'+returnAddons(item.addons)+'</td><td class="num"><strong>'+returnMoney(item.amount)+'</strong></td><td class="operation-column">'+returnActions(item)+'</td></tr>'}).join(''):'<tr><td colspan="10" class="mark-table-empty">暂无匹配退货单</td></tr>';document.getElementById('return-result-count').textContent='共 '+returnFiltered.length+' 条';document.getElementById('return-total-count').textContent=returnFiltered.length;document.getElementById('return-current').textContent=returnPage+' / '+pages;document.getElementById('return-prev').disabled=returnPage<=1;document.getElementById('return-next').disabled=returnPage>=pages||returnFiltered.length===0}
function applyReturnFilters(){var id=document.getElementById('return-filter-id').value.trim().toLowerCase();var order=document.getElementById('return-filter-order').value.trim().toLowerCase();var status=document.getElementById('return-filter-status').value;returnFiltered=returnData.filter(function(item){return (!id||item.id.toLowerCase().indexOf(id)>-1)&&(!order||item.orderId.toLowerCase().indexOf(order)>-1)&&(!status||item.status===status)});returnPage=1;renderReturns()}
function resetReturnFilters(){document.getElementById('return-filter-id').value='';document.getElementById('return-filter-order').value='';document.getElementById('return-filter-status').value='';applyReturnFilters()}
function openReturnAction(id){var item=findReturn(id);if(!item||item.status!=='待人工审核')return;returnAction={id:id};document.getElementById('return-action-summary').innerHTML='<strong>'+item.id+'</strong><span>'+returnEscape(item.items[0].name)+' · '+returnQuantity(item)+' 件</span>';document.getElementById('return-action-rules').innerHTML='<strong>命中 '+item.ruleHits.length+' 条审核规则</strong>'+returnRuleTags(item);document.querySelector('input[name="return-disposition"][value="等仓库收货后再选择"]').checked=true;document.getElementById('return-addon-inspection').checked=false;document.getElementById('return-addon-repack').checked=false;document.getElementById('return-review-note').value='';document.getElementById('return-action-modal').classList.add('open')}
function closeReturnAction(){document.getElementById('return-action-modal').classList.remove('open')}
function submitReturnAction(){var item=findReturn(returnAction.id);if(!item||item.status!=='待人工审核')return;var disposition=document.querySelector('input[name="return-disposition"]:checked');if(!disposition){showToast('请选择收货后处理方式','warning');return}item.disposition=disposition.value;item.addons=[];if(document.getElementById('return-addon-inspection').checked)item.addons.push('申请拆箱质检');if(document.getElementById('return-addon-repack').checked)item.addons.push('申请换箱');item.status='人工通过';item.reviewMethod='运营人工审核';item.reviewedBy='当前运营';item.reviewedAt=new Date().toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-');item.reviewNote=document.getElementById('return-review-note').value.trim();item.omsProgressStep=2;closeReturnAction();showToast('人工审核已通过');updateReturnStats();applyReturnFilters()}
function rejectReturnAction(){var item=findReturn(returnAction.id);if(!item||item.status!=='待人工审核')return;var reason=document.getElementById('return-review-note').value.trim();if(!reason){showToast('拒绝申请时请填写审核备注','warning');document.getElementById('return-review-note').focus();return}item.status='已拒绝';item.reviewMethod='运营人工审核';item.reviewedBy='当前运营';item.reviewedAt=new Date().toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-');item.rejectionReason=reason;item.disposition='';item.addons=[];item.omsProgressStep=2;closeReturnAction();showToast('退货申请已拒绝');updateReturnStats();applyReturnFilters()}
function returnProgressTimeline(item){var processing=item.disposition||'人工审核后确定';var reviewDescription=item.status==='待人工审核'?'命中 '+item.ruleHits.length+' 条规则，等待运营审核':item.status==='自动通过'?(item.reviewedAt+' · 系统自动通过'):item.status==='人工通过'?(item.reviewedAt+' · 运营人工通过'):item.reviewedAt+' · 已拒绝：'+item.rejectionReason;var steps=[{title:'退货申请已提交',desc:item.createdAt+' · 买家提交退货申请'},{title:'审核判定',desc:reviewDescription},{title:'仓库收货',desc:Number(item.omsProgressStep)>=3?'仓库已确认收到退件':'等待仓库收货'},{title:'收货后处理',desc:Number(item.omsProgressStep)>=4?'已按“'+processing+'”完成处理':processing}];return '<div class="return-progress-timeline">'+steps.map(function(step,index){var number=index+1;var state;if(item.status==='已拒绝'){state=index===0?'done':index===1?'rejected':'stopped'}else{var completed=Number(item.omsProgressStep||1);state=completed>=number?'done':completed+1===number?'current':'upcoming'}return '<div class="return-progress-step '+state+'"><span class="return-progress-dot">'+(state==='done'?'\u2713':state==='rejected'?'!':state==='stopped'?'—':number)+'</span><div><strong>'+returnEscape(step.title)+'</strong><p>'+returnEscape(state==='stopped'?'申请已拒绝，流程终止':step.desc)+'</p></div></div>'}).join('')+'</div>'}
function openReturnDetail(id){var item=findReturn(id);if(!item)return;var quantity=returnQuantity(item);var instruction=item.status==='已拒绝'?'不适用':item.disposition||'人工审核后确定';document.getElementById('return-detail-title').textContent='退货详情 · '+item.id;document.getElementById('return-detail-content').innerHTML='<div class="return-detail-meta"><div><span>关联订单</span><strong>'+returnEscape(item.orderId)+'</strong></div><div><span>审核状态</span><strong><span class="return-status '+returnStatusClass(item.status)+'">'+item.status+'</span></strong></div><div><span>退货用户</span><strong>'+returnEscape(item.userName)+'</strong></div><div><span>退货原因</span><strong>'+returnEscape(item.reason)+'</strong></div><div><span>审核方式</span><strong>'+returnEscape(item.reviewMethod)+'</strong></div><div><span>审核人</span><strong>'+returnEscape(item.reviewedBy||'待审核')+'</strong></div><div><span>收货后处理方式</span><strong>'+returnEscape(instruction)+'</strong></div><div><span>增值作业</span><strong>'+(item.addons&&item.addons.length?item.addons.map(returnEscape).join('、'):'无')+'</strong></div><div class="return-detail-rule-card"><span>命中规则</span><strong>'+returnRuleTags(item)+'</strong></div>'+(item.rejectionReason?'<div class="return-detail-rejection"><span>拒绝原因</span><strong>'+returnEscape(item.rejectionReason)+'</strong></div>':'')+'</div><section class="return-detail-products"><h4>退货商品</h4>'+item.items.map(function(row){return '<div><img src="'+returnEscape(row.img)+'" alt=""><span><strong>'+returnEscape(row.name)+'</strong><small>'+returnEscape(row.spec)+' · '+returnEscape(row.sku)+'</small></span><b>'+row.quantity+' 件</b></div>'}).join('')+'<p><span>共 '+quantity+' 件</span><strong>'+returnMoney(item.amount)+'</strong></p></section><section class="return-detail-progress"><h4>退货进度</h4>'+returnProgressTimeline(item)+'</section>';document.getElementById('return-detail-modal').classList.add('open')}
function closeReturnDetail(){document.getElementById('return-detail-modal').classList.remove('open')}
document.getElementById('return-search').addEventListener('click',applyReturnFilters);document.getElementById('return-reset').addEventListener('click',resetReturnFilters);document.getElementById('return-prev').addEventListener('click',function(){returnPage=Math.max(1,returnPage-1);renderReturns()});document.getElementById('return-next').addEventListener('click',function(){returnPage++;renderReturns()});document.getElementById('return-tbody').addEventListener('click',function(event){var reviewButton=event.target.closest('[data-return-review]');if(reviewButton){openReturnAction(reviewButton.dataset.returnReview);return}var detailButton=event.target.closest('[data-return-detail]');if(detailButton)openReturnDetail(detailButton.dataset.returnDetail)});document.getElementById('return-action-close').addEventListener('click',closeReturnAction);document.getElementById('return-action-cancel').addEventListener('click',closeReturnAction);document.getElementById('return-action-confirm').addEventListener('click',submitReturnAction);document.getElementById('return-action-reject').addEventListener('click',rejectReturnAction);document.getElementById('return-action-modal').addEventListener('click',function(event){if(event.target===this)closeReturnAction()});document.getElementById('return-detail-close').addEventListener('click',closeReturnDetail);document.getElementById('return-detail-confirm').addEventListener('click',closeReturnDetail);document.getElementById('return-detail-modal').addEventListener('click',function(event){if(event.target===this)closeReturnDetail()});document.addEventListener('keydown',function(event){if(event.key==='Escape'){closeReturnAction();closeReturnDetail()}});updateReturnStats();applyReturnFilters();
