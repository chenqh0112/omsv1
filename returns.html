<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>退货管理 - 独立站</title>
<link rel="stylesheet" href="styles.css?v=20260828-returns-pagination">
<script src="navigation.js?v=20260828-returns" defer></script>
</head><body data-page="returns">
<aside class="app-nav"><div class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>独立站</div><nav class="nav-list"></nav><div class="nav-footer">独立站</div></aside>
<div class="app-content">
  <div class="topbar"><div class="topbar-left"><h1>退货管理</h1></div><div class="topbar-right"><div class="user"><button class="avatar" type="button" data-role-avatar aria-haspopup="dialog" aria-label="切换身份" title="切换身份">超</button></div></div></div>
  <main class="page-body ops-page-body">
    <section class="ops-stat-grid page-section" aria-label="退货统计">
      <div class="stat-card ops-stat return-stat-pending"><div class="stat-heading"><div class="stat-label">待处理退货</div><p>新退回来还没处理</p></div><div class="stat-metric-row"><div class="stat-value" id="return-stat-pending">0</div><div class="stat-trend trend-good-down"><strong>↓ 6.2%</strong><span>vs 上周</span></div></div></div>
      <div class="stat-card ops-stat return-stat-items"><div class="stat-heading"><div class="stat-label">退货商品</div><p>待检、待上架、待销毁件数</p></div><div class="stat-metric-row"><div class="stat-value" id="return-stat-items">0</div><div class="stat-trend trend-up"><strong>↑ 4.8%</strong><span>vs 上周</span></div></div></div>
      <div class="stat-card ops-stat return-stat-month"><div class="stat-heading"><div class="stat-label">本月退货单</div><p>本月创建的退货单数量</p></div><div class="stat-metric-row"><div class="stat-value" id="return-stat-month">0</div><div class="stat-trend trend-up"><strong>↑ 9.1%</strong><span>vs 上月</span></div></div></div>
      <div class="stat-card ops-stat return-stat-amount"><div class="stat-heading"><div class="stat-label">本月退货额</div><p>本月退款与抵扣金额</p></div><div class="stat-metric-row"><div class="stat-value" id="return-stat-amount">$0</div><div class="stat-trend trend-good-down"><strong>↓ 3.5%</strong><span>vs 上月</span></div></div></div>
    </section>
    <section class="filter-bar ops-filter-bar page-section" aria-label="退货筛选">
      <div class="filter-group"><label for="return-filter-id">退货单号</label><input id="return-filter-id" type="text" placeholder="请输入退货单号"></div>
      <div class="filter-group"><label for="return-filter-order">关联订单号</label><input id="return-filter-order" type="text" placeholder="请输入订单号"></div>
      <div class="filter-group"><label for="return-filter-status">退货状态</label><select id="return-filter-status"><option value="">全部</option><option>待收货</option><option>已收货</option><option>质检中</option><option>已上架</option><option>已销毁</option><option>待退款</option><option>已退款</option></select></div>
      <div class="filter-actions"><button class="btn btn-primary" id="return-search" type="button">搜索</button><button class="btn btn-ghost" id="return-reset" type="button">重置</button></div>
    </section>
    <section class="table-wrap ops-table-wrap page-section"><div class="table-head-bar"><h3>退货单列表</h3><span class="result-count" id="return-result-count">共 0 条</span></div><div class="table-scroll"><table class="data-table return-admin-table"><thead><tr><th>退货单号</th><th>关联订单号</th><th>退货用户/公司</th><th>退货SKU+数量</th><th>退货原因</th><th>退货状态</th><th>退货金额</th><th class="operation-column">操作</th></tr></thead><tbody id="return-tbody"></tbody></table></div><div class="pagination"><span class="pagination-info">共 <strong id="return-total-count">0</strong> 条</span><div class="pagination-btns"><button class="page-btn" id="return-prev" type="button">‹</button><button class="page-btn active" id="return-current" type="button">1 / 1</button><button class="page-btn" id="return-next" type="button">›</button></div></div></section>
  </main>
</div>
<div class="modal-overlay" id="return-action-modal" role="dialog" aria-modal="true" aria-labelledby="return-action-title"><div class="modal return-action-modal"><div class="modal-head"><h3 id="return-action-title">处理退货</h3><button class="close" id="return-action-close" type="button" aria-label="关闭">&times;</button></div><div class="modal-body"><div class="return-action-summary" id="return-action-summary"></div><div class="manage-form-field" id="return-package-field" hidden><label for="return-package">退件状态</label><select id="return-package"><option>外包装完好</option><option>外包装破损</option></select></div><div class="manage-form-field" id="return-quality-field" hidden><label for="return-quality">质检结论</label><select id="return-quality"><option>可再售</option><option>需翻新贴标</option><option>只能销毁</option></select></div><div class="manage-form-field" id="return-note-field" hidden><label for="return-note">处理说明</label><textarea id="return-note" rows="3" placeholder="请输入处理说明"></textarea></div><div class="manage-form-field" id="return-refund-field" hidden><label for="return-refund">退款金额</label><input id="return-refund" type="number" min="0" step="0.01"></div></div><div class="modal-footer"><button class="btn btn-ghost" id="return-action-cancel" type="button">取消</button><button class="btn btn-primary" id="return-action-confirm" type="button">确认</button></div></div></div>
<script src="sku-data.js"></script><script src="order-data.js"></script>
<script>
var returnStatuses=['待收货','已收货','质检中','已上架','已销毁','待退款','已退款'];var returnReasons=['质量问题','错发','买家拒收','多退'];var returnData=[];var returnOrders=window.OMS_ORDER_DATA||[];
for(var returnIndex=0;returnIndex<31;returnIndex++){var order=returnOrders[returnIndex%returnOrders.length];var item=order.items[0];returnData.push({id:'RET-202608-'+String(1031-returnIndex).padStart(4,'0'),orderId:order.id,userName:order.userName,company:order.company,items:[{sku:item.sku,name:item.name,spec:item.spec,img:item.img,quantity:1+returnIndex%6}],reason:returnReasons[returnIndex%returnReasons.length],status:returnStatuses[returnIndex%returnStatuses.length],amount:Number((item.unitPrice*(1+returnIndex%6)).toFixed(2)),createdAt:'2026-08-'+String(28-returnIndex%27).padStart(2,'0')})}
try{var savedReturns=JSON.parse(localStorage.getItem('oms-return-requests')||'[]');savedReturns.forEach(function(item){if(!returnData.some(function(row){return row.id===item.id}))returnData.unshift(item)})}catch(error){}
var returnFiltered=returnData.slice();var returnPage=1;var returnPageSize=8;var returnAction={type:'',id:''};
function returnEscape(value){return String(value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}function returnMoney(value){return '$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function findReturn(id){return returnData.find(function(item){return item.id===id})}
function returnStatusClass(status){return 'return-status-'+({待收货:'waiting',已收货:'received',质检中:'quality',已上架:'shelved',已销毁:'destroyed',待退款:'refund',已退款:'refunded'}[status]||'waiting')}
function returnItemSummary(item){var total=item.items.reduce(function(sum,row){return sum+row.quantity},0);return '<div class="return-sku-cell"><img src="'+returnEscape(item.items[0].img)+'" alt=""><span><strong>'+returnEscape(item.items[0].name)+'</strong><small>'+item.items.length+' 个SKU / '+total+' 件</small></span></div>'}
function returnActions(item){var actions=[];if(item.status==='待收货')actions.push(['receive','收货']);if(item.status==='已收货')actions.push(['inspect','质检']);if(item.status==='质检中')actions.push(['shelve','上架'],['destroy','销毁']);if(item.status==='待退款'||item.status==='已销毁')actions.push(['refund','退款']);return actions.length?'<div class="table-actions">'+actions.map(function(action){return '<button class="btn-link '+(action[0]==='destroy'?'danger':'')+'" type="button" data-return-action="'+action[0]+'" data-return-id="'+item.id+'">'+action[1]+'</button>'}).join('')+'</div>':'<span class="muted-text">已完成</span>'}
function updateReturnStats(){document.getElementById('return-stat-pending').textContent=returnData.filter(function(item){return ['待收货','已收货','质检中'].indexOf(item.status)>-1}).length;document.getElementById('return-stat-items').textContent=returnData.filter(function(item){return ['已收货','质检中'].indexOf(item.status)>-1}).reduce(function(sum,item){return sum+item.items.reduce(function(total,row){return total+row.quantity},0)},0);document.getElementById('return-stat-month').textContent=returnData.filter(function(item){return item.createdAt.indexOf('2026-08')===0}).length;document.getElementById('return-stat-amount').textContent=returnMoney(returnData.filter(function(item){return item.createdAt.indexOf('2026-08')===0}).reduce(function(sum,item){return sum+item.amount},0))}
function renderReturns(){var pages=Math.max(1,Math.ceil(returnFiltered.length/returnPageSize));returnPage=Math.min(returnPage,pages);var pageData=returnFiltered.slice((returnPage-1)*returnPageSize,returnPage*returnPageSize);document.getElementById('return-tbody').innerHTML=pageData.length?pageData.map(function(item){return '<tr><td><code class="return-id">'+item.id+'</code></td><td><code>'+item.orderId+'</code></td><td><div class="order-user-cell"><strong>'+returnEscape(item.userName)+'</strong><span>'+returnEscape(item.company)+'</span></div></td><td>'+returnItemSummary(item)+'</td><td>'+item.reason+'</td><td><span class="return-status '+returnStatusClass(item.status)+'">'+item.status+'</span></td><td class="num"><strong>'+returnMoney(item.amount)+'</strong></td><td class="operation-column">'+returnActions(item)+'</td></tr>'}).join(''):'<tr><td colspan="8" class="mark-table-empty">暂无匹配退货单</td></tr>';document.getElementById('return-result-count').textContent='共 '+returnFiltered.length+' 条';document.getElementById('return-total-count').textContent=returnFiltered.length;document.getElementById('return-current').textContent=returnPage+' / '+pages;document.getElementById('return-prev').disabled=returnPage<=1;document.getElementById('return-next').disabled=returnPage>=pages||returnFiltered.length===0}
function applyReturnFilters(){var id=document.getElementById('return-filter-id').value.trim().toLowerCase();var order=document.getElementById('return-filter-order').value.trim().toLowerCase();var status=document.getElementById('return-filter-status').value;returnFiltered=returnData.filter(function(item){return (!id||item.id.toLowerCase().indexOf(id)>-1)&&(!order||item.orderId.toLowerCase().indexOf(order)>-1)&&(!status||item.status===status)});returnPage=1;renderReturns()}
function resetReturnFilters(){document.getElementById('return-filter-id').value='';document.getElementById('return-filter-order').value='';document.getElementById('return-filter-status').value='';applyReturnFilters()}
function openReturnAction(type,id){var item=findReturn(id);if(!item)return;returnAction={type:type,id:id};var titles={receive:'收货登记',inspect:'质检',shelve:'退货上架',destroy:'退货销毁',refund:'确认退款'};document.getElementById('return-action-title').textContent=titles[type];document.getElementById('return-action-summary').innerHTML='<strong>'+item.id+'</strong><span>'+returnEscape(item.items[0].name)+' · '+item.items.reduce(function(sum,row){return sum+row.quantity},0)+' 件</span>';document.getElementById('return-package-field').hidden=type!=='receive';document.getElementById('return-quality-field').hidden=type!=='inspect';document.getElementById('return-note-field').hidden=['shelve','destroy'].indexOf(type)===-1;document.getElementById('return-refund-field').hidden=type!=='refund';document.getElementById('return-refund').value=item.amount.toFixed(2);document.getElementById('return-note').value='';document.getElementById('return-action-modal').classList.add('open')}
function closeReturnAction(){document.getElementById('return-action-modal').classList.remove('open')}
function submitReturnAction(){var item=findReturn(returnAction.id);if(!item)return;var messages={receive:'收货登记成功',inspect:'质检已完成',shelve:'商品已上架并回到 OMS 可用库存',destroy:'商品已销毁，已关联退货销毁费',refund:'退款已完成'};if(returnAction.type==='receive'){item.packageStatus=document.getElementById('return-package').value;item.status='已收货'}if(returnAction.type==='inspect'){item.quality=document.getElementById('return-quality').value;item.status='质检中'}if(returnAction.type==='shelve'){item.status='已上架'}if(returnAction.type==='destroy'){if(!document.getElementById('return-note').value.trim()){showToast('请输入销毁处理说明','warning');return}item.status='已销毁'}if(returnAction.type==='refund'){var amount=parseFloat(document.getElementById('return-refund').value);if(!(amount>=0)){showToast('请输入正确的退款金额','warning');return}item.amount=amount;item.status='已退款'}closeReturnAction();showToast(messages[returnAction.type]);updateReturnStats();applyReturnFilters()}
document.getElementById('return-search').addEventListener('click',applyReturnFilters);document.getElementById('return-reset').addEventListener('click',resetReturnFilters);document.getElementById('return-prev').addEventListener('click',function(){returnPage=Math.max(1,returnPage-1);renderReturns()});document.getElementById('return-next').addEventListener('click',function(){returnPage++;renderReturns()});document.getElementById('return-tbody').addEventListener('click',function(event){var button=event.target.closest('[data-return-action]');if(button)openReturnAction(button.dataset.returnAction,button.dataset.returnId)});document.getElementById('return-action-close').addEventListener('click',closeReturnAction);document.getElementById('return-action-cancel').addEventListener('click',closeReturnAction);document.getElementById('return-action-confirm').addEventListener('click',submitReturnAction);document.getElementById('return-action-modal').addEventListener('click',function(event){if(event.target===this)closeReturnAction()});updateReturnStats();applyReturnFilters();
</script>
<script src="toast.js?v=20260828-cart-action"></script><script src="role-switch.js"></script><script src="notes.js?v=20260828-returns"></script>
</body></html>
