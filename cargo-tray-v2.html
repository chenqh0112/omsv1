<script>
var v2MoqOptions=[12,24,36,48,60];
var v2Data=(window.OMS_SKU_DATA||[]).map(function(item,index){return Object.assign({},item,{moq:v2MoqOptions[index%v2MoqOptions.length]})});
var v2Filtered=v2Data.slice();
var v2Page=1;
var v2PageSize=15;
var v2Cart={};
var v2Selected={};
var v2StatusFilter='全部';
var v2Sort='recommended';
var v2Orders=(window.OMS_ORDER_DATA||[]).filter(function(order){return order.userName==='采购用户A'});var v2OrderPage=1;var v2OrderPageSize=5;var v2ReturnOrderId='';
var v2Favorites={};
try{JSON.parse(localStorage.getItem('oms-v2-favorites')||'[]').forEach(function(sku){v2Favorites[sku]=true})}catch(error){}
var v2Categories=[
  {id:'recommended',name:'推荐分类',subtitle:'常用采购商品与热门规格',match:function(){return true}},
  {id:'thermal',name:'保温杯',subtitle:'通勤、商务与礼赠保温杯',match:function(item){return item.name.indexOf('保温')>-1||item.name.indexOf('真空')>-1}},
  {id:'sports',name:'运动水壶',subtitle:'运动、健身与大容量水壶',match:function(item){return item.name.indexOf('运动')>-1||item.name.indexOf('水壶')>-1||item.name.indexOf('健身')>-1}},
  {id:'straw',name:'吸管杯',subtitle:'成人及儿童吸管水杯',match:function(item){return item.name.indexOf('吸管')>-1}},
  {id:'office',name:'办公通勤',subtitle:'办公室与城市通勤用杯',match:function(item){return item.name.indexOf('办公')>-1||item.name.indexOf('商务')>-1||item.name.indexOf('通勤')>-1||item.name.indexOf('咖啡')>-1}},
  {id:'family',name:'家庭儿童',subtitle:'儿童、家庭与主题水杯',match:function(item){return item.name.indexOf('儿童')>-1||item.name.indexOf('花朵')>-1||item.name.indexOf('熊猫')>-1||item.name.indexOf('迷你')>-1}}
];

function v2Money(value){return '$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function v2Escape(value){return String(value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}
function v2StatusClass(status){return status==='充足'?'status-full':status==='偏少'?'status-low':'status-out'}
function v2Card(item){
  var disabled=item.available<=0;
  var selected=Boolean(v2Selected[item.barcode]);
  var favorite=Boolean(v2Favorites[item.barcode]);
  var quantity=selected?v2Selected[item.barcode].quantity:(disabled?0:1);
  return '<article class="v2-product-card'+(selected?' selected':'')+'" data-v2-sku="'+item.barcode+'"><div class="v2-card-media"><label class="v2-card-select"><input type="checkbox" data-v2-select="'+item.barcode+'" '+(selected?'checked':'')+' aria-label="选择 '+v2Escape(item.name+' '+item.spec)+'"></label><span class="v2-stock-badge '+v2StatusClass(item.sellableStatus)+'"><i></i><span>'+item.sellableStatus+'</span></span><button class="v2-product-image" type="button" data-v2-preview="'+item.barcode+'" aria-label="预览 '+v2Escape(item.name)+' 图片"><img src="'+v2Escape(item.img)+'" alt="'+v2Escape(item.name)+'"></button><button class="v2-card-favorite'+(favorite?' active':'')+'" type="button" data-v2-favorite="'+item.barcode+'" aria-label="'+(favorite?'取消收藏 ':'收藏 ')+v2Escape(item.name)+'" title="'+(favorite?'取消收藏':'收藏')+'"><svg viewBox="0 0 24 24" fill="'+(favorite?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg></button></div><div class="v2-card-body"><h3>'+v2Escape(item.name)+'</h3><p class="v2-card-description">'+v2Escape(item.spec)+' · 美国仓现货</p><div class="v2-card-price-row"><strong>'+v2Money(item.unitPrice)+'</strong><span>单价</span></div><div class="v2-card-stock"><span>可售 <b>'+item.available.toLocaleString('en-US')+'</b> 件</span><span class="v2-card-identifiers"><small>MOQ <b>'+item.moq+'</b> 件</small><code>'+v2Escape(item.barcode)+'</code></span></div><div class="v2-card-action"><div class="v2-qty-stepper" aria-label="'+v2Escape(item.name+' '+item.spec)+'采购数量"><button type="button" data-v2-qty-step="-1" aria-label="减少数量" '+(disabled?'disabled':'')+'>−</button><input class="v2-card-qty" type="number" min="1" max="'+item.available+'" value="'+quantity+'" '+(disabled?'disabled':'')+' aria-label="采购数量"><button type="button" data-v2-qty-step="1" aria-label="增加数量" '+(disabled?'disabled':'')+'>＋</button></div><button class="v2-card-add" type="button" data-v2-add="'+item.barcode+'" aria-label="加入购物车" title="加入购物车" '+(disabled?'disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="20" r="1"></circle><circle cx="19" cy="20" r="1"></circle><path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6"></path></svg></button></div></div></article>';
}
function renderV2Products(){
  var totalPages=Math.max(1,Math.ceil(v2Filtered.length/v2PageSize));
  v2Page=Math.min(v2Page,totalPages);
  var pageData=v2Filtered.slice((v2Page-1)*v2PageSize,v2Page*v2PageSize);
  document.getElementById('v2-product-grid').innerHTML=pageData.length?pageData.map(v2Card).join(''):'<div class="v2-empty-result">没有找到匹配的SKU</div>';
  document.getElementById('v2-current').textContent=v2Page;
  document.getElementById('v2-prev').disabled=v2Page<=1;
  document.getElementById('v2-next').disabled=v2Page>=totalPages||v2Filtered.length===0;
}
function applyV2Filters(){
  var keyword=document.getElementById('v2-search-input').value.trim().toLowerCase();
  v2Filtered=v2Data.filter(function(item){var keywordMatch=!keyword||item.name.toLowerCase().indexOf(keyword)>-1||item.spec.toLowerCase().indexOf(keyword)>-1||item.barcode.toLowerCase().indexOf(keyword)>-1;var statusMatch=v2StatusFilter==='全部'||item.sellableStatus===v2StatusFilter;return keywordMatch&&statusMatch});
  if(v2Sort==='price-asc')v2Filtered.sort(function(a,b){return a.unitPrice-b.unitPrice});
  if(v2Sort==='price-desc')v2Filtered.sort(function(a,b){return b.unitPrice-a.unitPrice});
  if(v2Sort==='stock-desc')v2Filtered.sort(function(a,b){return b.available-a.available});
  v2Page=1;renderV2Products();
}
function saveV2Favorites(){try{localStorage.setItem('oms-v2-favorites',JSON.stringify(Object.keys(v2Favorites)))}catch(error){}}
function toggleV2Favorite(sku){
  var item=v2Data.find(function(entry){return entry.barcode===sku});if(!item)return;
  if(v2Favorites[sku]){delete v2Favorites[sku];showToast('已取消收藏')}else{v2Favorites[sku]=true;showToast('已加入我的收藏')}
  saveV2Favorites();renderV2Products();
  if(!document.getElementById('v2-account-page').hidden&&document.getElementById('v2-account-page').dataset.view==='favorites')renderV2FavoritesPage();
}
function renderV2Category(categoryId){
  var category=v2Categories.find(function(item){return item.id===categoryId})||v2Categories[0];
  document.getElementById('v2-category-sidebar').innerHTML=v2Categories.map(function(item){return '<button type="button" class="'+(item.id===category.id?'active':'')+'" data-v2-category="'+item.id+'"><span>'+v2Escape(item.name)+'</span><b>›</b></button>'}).join('');
  document.getElementById('v2-category-title').textContent=category.name;
  document.getElementById('v2-category-subtitle').textContent=category.subtitle;
  var products=v2Data.filter(category.match).filter(function(item,index,list){return list.findIndex(function(other){return other.name===item.name})===index}).slice(0,12);
  if(products.length<6)products=v2Data.filter(function(item,index,list){return list.findIndex(function(other){return other.name===item.name})===index}).slice(0,12);
  document.getElementById('v2-category-products').innerHTML=products.map(function(item){return '<button type="button" data-v2-category-product="'+v2Escape(item.name)+'"><span><img src="'+v2Escape(item.img)+'" alt=""></span><strong>'+v2Escape(item.name)+'</strong></button>'}).join('');
}
function openV2Category(){renderV2Category('recommended');document.getElementById('v2-category-panel').hidden=false;document.getElementById('v2-category-trigger').setAttribute('aria-expanded','true')}
function closeV2Category(){document.getElementById('v2-category-panel').hidden=true;document.getElementById('v2-category-trigger').setAttribute('aria-expanded','false')}
function v2OrderStatusClass(status){return 'order-status-'+({待审核:'review',待分配仓库:'allocating',待仓库拣货:'warehouse',待物流收揽:'pickup',已发货:'shipped',商品缺货:'outofstock',已关闭:'closed',拦截发货成功:'intercepted'}[status]||'review')}
function canV2Return(order){return order.status==='已发货'}
function showV2Catalog(){document.getElementById('v2-account-page').hidden=true;document.getElementById('v2-catalog-view').hidden=false;document.getElementById('v2-order-cart-toggle').hidden=false;document.querySelector('.v2-page-body').scrollTop=0}
function openV2AccountPage(view){

  var returnButton=document.getElementById('v2-order-detail-modal').querySelector('.v2-detail-return-action');if(returnButton)returnButton.remove();if(canV2Return(order)){returnButton=document.createElement('button');returnButton.className='btn btn-ghost v2-detail-return-action';returnButton.type='button';returnButton.dataset.v2Return=order.id;returnButton.textContent='申请退货';document.getElementById('v2-order-detail-modal').querySelector('.modal-footer').prepend(returnButton)}

function submitV2Return(){var order=v2Orders.find(function(item){return item.id===v2ReturnOrderId});if(!order)return;var selected=[].slice.call(document.querySelectorAll('#v2-return-items [data-v2-return-item]:checked')).map(function(check){var source=order.items.find(function(item){return item.sku===check.dataset.v2ReturnItem});var quantity=Math.max(1,Math.min(source.quantity,parseInt(check.closest('.v2-return-item').querySelector('input[type="number"]').value,10)||1));return {sku:source.sku,name:source.name,spec:source.spec,img:source.img,quantity:quantity,unitPrice:source.unitPrice}});if(!selected.length){showToast('请至少选择一个退货商品','warning');return}var amount=selected.reduce(function(sum,item){return sum+item.unitPrice*item.quantity},0);var request={id:'RET-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+String(Date.now()).slice(-4),orderId:order.id,userName:order.userName,company:order.company,items:selected,reason:document.getElementById('v2-return-reason').value,status:'待收货',amount:Number(amount.toFixed(2)),createdAt:new Date().toISOString().slice(0,10),note:document.getElementById('v2-return-note').value.trim()};try{var saved=JSON.parse(localStorage.getItem('oms-return-requests')||'[]');saved.unshift(request);localStorage.setItem('oms-return-requests',JSON.stringify(saved))}catch(error){}closeV2Return();showToast('退货申请已提交，可在退货管理中查看')}
function v2CartTotals(){
  return Object.keys(v2Cart).reduce(function(result,sku){var entry=v2Cart[sku];result.skus++;result.quantity+=entry.quantity;result.total+=entry.item.unitPrice*entry.quantity;return result},{skus:0,quantity:0,total:0});
}
function v2CheckoutFees(totals){var shipping=totals.skus?18:0;var operation=totals.skus?Math.max(6,totals.total*.018):0;var packaging=totals.skus?4.5+totals.skus*.75:0;return {shipping:shipping,operation:operation,packaging:packaging,oms:operation+packaging,total:totals.total+shipping+operation+packaging}}
function v2ReviewReasons(totals,fees){var reasons=[];if(fees.total>5000)reasons.push('首单金额超过5000美元');if(v2Orders.length===0)reasons.push('新用户首次下单');var historyAverage=v2Orders.length?v2Orders.reduce(function(sum,order){return sum+order.items.reduce(function(total,item){return total+item.quantity},0)},0)/v2Orders.length:0;if(historyAverage&&totals.quantity>historyAverage*3)reasons.push('数量超过历史平均数量的3倍');var inventoryLockFailed=Object.keys(v2Cart).some(function(sku){var entry=v2Cart[sku];return entry.quantity>entry.item.available});if(inventoryLockFailed)reasons.push('库存锁定失败');return reasons}
function updateV2Cart(){
  var totals=v2CartTotals();
  var fees=v2CheckoutFees(totals);
  document.getElementById('v2-cart-count').textContent='('+totals.skus+')';
  document.getElementById('v2-header-cart-count').textContent=totals.skus;
  document.getElementById('v2-cart-total').textContent=v2Money(totals.total);
  document.getElementById('v2-modal-total').textContent=v2Money(totals.total);
  document.getElementById('v2-checkout-count').textContent=totals.skus+' 个SKU / '+totals.quantity+' 件';
  document.getElementById('v2-checkout-goods').textContent=v2Money(totals.total);
  document.getElementById('v2-checkout-shipping').textContent=v2Money(fees.shipping);
  document.getElementById('v2-checkout-oms-fee').textContent=v2Money(fees.oms);
  document.getElementById('v2-checkout-fee-detail').textContent='操作费 '+v2Money(fees.operation)+' · 包材费 '+v2Money(fees.packaging);
  document.getElementById('v2-checkout-total').textContent=v2Money(fees.total);
  var entries=Object.keys(v2Cart).map(function(sku){return v2Cart[sku]});
  document.getElementById('v2-cart-list').innerHTML=entries.length?entries.map(function(entry){var item=entry.item;return '<div class="v2-cart-item" data-v2-cart-sku="'+item.barcode+'"><div class="v2-cart-product"><img src="'+v2Escape(item.img)+'" alt=""><div><strong>'+v2Escape(item.name)+'</strong><span>'+v2Escape(item.spec)+' · '+v2Escape(item.barcode)+'</span></div></div><span class="v2-cart-price">'+v2Money(item.unitPrice)+'</span><input type="number" min="1" max="'+item.available+'" value="'+entry.quantity+'" aria-label="'+v2Escape(item.name+' '+item.spec)+'购物车数量"><strong class="v2-cart-subtotal">'+v2Money(item.unitPrice*entry.quantity)+'</strong><button class="cart-remove" type="button" aria-label="删除 '+v2Escape(item.name+' '+item.spec)+'" title="删除">&times;</button></div>'}).join(''):'<div class="tray-cart-empty">购物车为空</div>';
}
function putV2CartItem(item,quantity){
  if(!item||item.available<=0)return false;
  quantity=Math.max(1,Math.min(item.available,parseInt(quantity,10)||1));
  if(!v2Cart[item.barcode])v2Cart[item.barcode]={item:item,quantity:quantity};else v2Cart[item.barcode].quantity=Math.min(item.available,v2Cart[item.barcode].quantity+quantity);
  return true;
}
function addV2Item(sku,card){
  card=card||document.querySelector('[data-v2-sku="'+sku+'"]');
  var item=v2Data.find(function(entry){return entry.barcode===sku});
  if(!item||item.available<=0)return;
  var quantity=Math.max(1,Math.min(item.available,parseInt(card.querySelector('.v2-card-qty').value,10)||1));
  putV2CartItem(item,quantity);
  updateV2Cart();showToast('已加入购物车','success',{label:'查看购物车',onClick:openV2Cart});
}
function updateV2Selection(){
  var count=Object.keys(v2Selected).length;
  document.getElementById('v2-selected-count').textContent=count;
  document.getElementById('v2-batch-add').disabled=count===0;
}
function batchAddV2Items(){
  var skus=Object.keys(v2Selected);
  if(!skus.length)return;
  var added=0;
  skus.forEach(function(sku){var selected=v2Selected[sku];if(putV2CartItem(selected.item,selected.quantity))added++});
  v2Selected={};renderV2Products();updateV2Selection();updateV2Cart();
  if(!added){showToast('所选SKU当前均为缺货','warning');return}
  showToast('已批量加入购物车（'+added+'个SKU）','success',{label:'查看购物车',onClick:openV2Cart});
}
