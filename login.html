<div class="app-content">
  <div class="topbar">
    <div class="topbar-left"><h1>登录</h1></div>
    <div class="topbar-right"><div class="user"><button class="avatar" type="button" data-role-avatar aria-haspopup="dialog" aria-label="切换身份" title="切换身份">超</button></div></div>
  </div>
  <main class="login-page-body">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-panel-head"><h2 id="login-title">登录独立站</h2><p>使用账号进入独立站管理系统</p></div>
      <form class="login-form" onsubmit="loginToOms(event)">
        <div class="login-field"><label for="login-account">账号</label><input id="login-account" type="text" autocomplete="username" placeholder="请输入账号"></div>
        <div class="login-field"><label for="login-password">密码</label><input id="login-password" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
        <label class="remember-row"><input type="checkbox" id="remember-password">记住密码</label>
        <div class="verify-control">
          <div class="verify-label"><span>滑块验证</span><strong id="verify-status">拖动滑块完成验证</strong></div>
          <input type="range" id="verify-slider" min="0" max="100" value="0" aria-label="滑块验证">
        </div>
        <button class="btn btn-primary login-submit" type="submit">登录</button>
      </form>
    </section>
  </main>
</div>

<script>
function loginToOms(event){event.preventDefault();window.location.href='index.html'}
document.getElementById('verify-slider').addEventListener('input',function(){
  var complete=this.value==='100';
  document.getElementById('verify-status').textContent=complete?'验证完成':'拖动滑块完成验证';
  this.setAttribute('aria-valuetext',complete?'验证完成':this.value+'%');
});
</script>
