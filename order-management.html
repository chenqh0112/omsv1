<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>订单管理 — 独立站</title><link rel="stylesheet" href="styles.css"><script src="navigation.js" defer></script>
</head><body data-page="orders">
<aside class="app-nav"><div class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>独立站</div><nav class="nav-list"></nav><div class="nav-footer">独立站</div></aside>
<div class="app-content">
  <div class="topbar"><div class="topbar-left"><h1>订单管理</h1></div><div class="topbar-right"><div class="user"><button class="avatar" type="button" data-role-avatar aria-haspopup="dialog" aria-label="切换身份" title="切换身份">超</button></div></div></div>
  <main class="page-body ops-page-body">
    <section class="ops-stat-grid page-section" aria-label="订单统计">
      <div class="stat-card ops-stat ops-stat-pending"><div class="stat-label">待处理订单</div><div class="stat-value" id="order-stat-pending">0</div><p>新下单且尚未确认</p></div>
      <div class="stat-card ops-stat ops-stat-processing"><div class="stat-label">处理中</div><div class="stat-value" id="order-stat-processing">0</div><p>已确认或正在拣货</p></div>
      <div class="stat-card ops-stat ops-stat-shipped"><div class="stat-label">已发货</div><div class="stat-value" id="order-stat-shipped">0</div><p>已出库等待签收</p></div>
      <div class="stat-card ops-stat ops-stat-revenue"><div class="stat-label">本月成交额</div><div class="stat-value" id="order-stat-revenue">$0.00</div><p>本月非取消订单金额</p></div>
    </section>
    <section class="filter-bar ops-filter-bar page-section" aria-label="订单筛选">
      <div class="filter-group"><label for="order-filter-id">订单号</label><input id="order-filter-id" type="text" placeholder="请输入订单号" autocomplete="off"></div>
      <div class="filter-group"><label for="order-filter-user">下单用户/公司</label><input id="order-filter-user" type="text" placeholder="请输入用户名或公司" autocomplete="off"></div>
      <div class="filter-group"><label for="order-filter-status">订单状态</label><select id="order-filter-status"><option value="">全部</option><option>待确认</option><option>已确认</option><option>拣货中</option><option>已发货</option><option>已签收</option><option>已取消</option></select></div>
      <div class="filter-actions"><button class="btn btn-primary" id="order-search" type="button">搜索</button><button class="btn btn-ghost" id="order-reset" type="button">重置</button></div>
    </section>
    <section class="table-wrap ops-table-wrap page-section"><div class="table-head-bar"><h3>订单列表</h3><span class="result-count" id="order-result-count">共 0 条</span></div><div class="table-scroll"><table class="data-table order-admin-table"><thead><tr><th>订单号</th><th>下单用户</th><th>下单时间</th><th>SKU明细</th><th>订单金额</th><th>订单状态</th><th>物流单号</th><th class="operation-column">操作</th></tr></thead><tbody id="order-tbody"></tbody></table></div><div class="pagination"><span class="pagination-info">共 <strong id="order-total-count">0</strong> 条</span><div class="pagination-btns"><button class="page-btn" id="order-prev" type="button">‹</button><button class="page-btn active" id="order-current" type="button">1</button><button class="page-btn" id="order-next" type="button">›</button></div></div></section>
  </main>
</div>
<div class="modal-overlay" id="order-detail-modal" role="dialog" aria-modal="true" aria-labelledby="order-detail-title"><div class="modal order-detail-modal"><div class="modal-head"><h3 id="order-detail-title">订单详情</h3><button class="close" type="button" data-order-detail-close aria-label="关闭">&times;</button></div><div class="modal-body" id="order-detail-content"></div><div class="modal-footer"><button class="btn btn-primary" type="button" data-order-detail-close>关闭</button></div></div></div>
<div class="modal-overlay" id="order-action-modal" role="dialog" aria-modal="true" aria-labelledby="order-action-title"><div class="modal order-action-modal"><div class="modal-head"><h3 id="order-action-title">处理订单</h3><button class="close" type="button" id="order-action-close" aria-label="关闭">&times;</button></div><div class="modal-body"><p class="order-action-copy" id="order-action-copy"></p><div class="manage-form-field" id="order-reason-field" hidden><label for="order-reject-reason">拒绝原因</label><textarea id="order-reject-reason" rows="3" placeholder="请输入拒绝原因"></textarea></div><div class="manage-form-field" id="order-tracking-field" hidden><label for="order-tracking-input">物流单号</label><input id="order-tracking-input" type="text" placeholder="请输入物流单号"></div></div><div class="modal-footer"><button class="btn btn-ghost" type="button" id="order-action-cancel">取消</button><button class="btn btn-primary" type="button" id="order-action-confirm">确认</button></div></div></div>
<script src="sku-data.js"></script><script src="order-data.js"></script>
<script>
var orderData=(window.OMS_ORDER_DATA||[]).map(function(order){return Object.assign({},order,{items:order.items.map(function(item){return Object.assign({},item)})})});var orderFiltered=orderData.slice();var orderPage=1;var orderPageSize=8;var orderAction={type:'',id:''};
function orderEscape(value){return String(value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}function orderMoney(value){return '$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function orderStatusClass(status){return 'order-status-'+({待确认:'pending',已确认:'confirmed',拣货中:'picking',已发货:'shipped',已签收:'signed',已取消:'cancelled'}[status]||'pending')}function findOrder(id){return orderData.find(function(order){return order.id===id})}
function updateOrderStats(){document.getElementById('order-stat-pending').textContent=orderData.filter(function(order){return order.status==='待确认'}).length;document.getElementById('order-stat-processing').textContent=orderData.filter(function(order){return order.status==='已确认'||order.status==='拣货中'}).length;document.getElementById('order-stat-shipped').textContent=orderData.filter(function(order){return order.status==='已发货'}).length;document.getElementById('order-stat-revenue').textContent=orderMoney(orderData.filter(function(order){return order.createdAt.indexOf('2026-08')===0&&order.status!=='已取消'}).reduce(function(sum,order){return sum+order.amount},0))}
function orderSkuSummary(order){var total=order.items.reduce(function(sum,item){return sum+item.quantity},0);return '<button class="order-sku-summary" type="button" data-order-detail="'+order.id+'"><strong>'+orderEscape(order.items[0].name)+'</strong><span>'+order.items.length+' 个SKU / '+total+' 件 · 查看</span></button>'}
function orderActions(order){var actions=[];if(order.status==='待确认')actions.push('<button class="btn-link" type="button" data-order-action="confirm" data-order-id="'+order.id+'">确认</button>','<button class="btn-link danger" type="button" data-order-action="reject" data-order-id="'+order.id+'">拒绝</button>');if(order.status==='已确认'||order.status==='拣货中')actions.push('<button class="btn-link" type="button" data-order-action="ship" data-order-id="'+order.id+'">标记已发货</button>');actions.push('<button class="btn-link" type="button" data-order-detail="'+order.id+'">查看详情</button>');return '<div class="table-actions">'+actions.join('')+'</div>'}
function renderOrders(){var pages=Math.max(1,Math.ceil(orderFiltered.length/orderPageSize));orderPage=Math.min(orderPage,pages);var pageData=orderFiltered.slice((orderPage-1)*orderPageSize,orderPage*orderPageSize);document.getElementById('order-tbody').innerHTML=pageData.length?pageData.map(function(order){return '<tr><td><code class="order-id">'+order.id+'</code></td><td><div class="order-user-cell"><strong>'+orderEscape(order.userName)+'</strong><span>'+orderEscape(order.company)+'</span></div></td><td>'+order.createdAt+'</td><td>'+orderSkuSummary(order)+'</td><td class="num"><strong>'+orderMoney(order.amount)+'</strong></td><td><span class="order-status '+orderStatusClass(order.status)+'">'+order.status+'</span></td><td><code>'+(order.tracking||'-')+'</code></td><td class="operation-column">'+orderActions(order)+'</td></tr>'}).join(''):'<tr><td colspan="8" class="mark-table-empty">暂无匹配订单</td></tr>';document.getElementById('order-result-count').textContent='共 '+orderFiltered.length+' 条';document.getElementById('order-total-count').textContent=orderFiltered.length;document.getElementById('order-current').textContent=orderPage;document.getElementById('order-prev').disabled=orderPage<=1;document.getElementById('order-next').disabled=orderPage>=pages||orderFiltered.length===0}
function applyOrderFilters(){var id=document.getElementById('order-filter-id').value.trim().toLowerCase();var user=document.getElementById('order-filter-user').value.trim().toLowerCase();var status=document.getElementById('order-filter-status').value;orderFiltered=orderData.filter(function(order){return (!id||order.id.toLowerCase().indexOf(id)>-1)&&(!user||(order.userName+' '+order.company).toLowerCase().indexOf(user)>-1)&&(!status||order.status===status)});orderPage=1;renderOrders()}function resetOrderFilters(){document.getElementById('order-filter-id').value='';document.getElementById('order-filter-user').value='';document.getElementById('order-filter-status').value='';applyOrderFilters()}
function openOrderDetail(id){var order=findOrder(id);if(!order)return;var totalQty=order.items.reduce(function(sum,item){return sum+item.quantity},0);document.getElementById('order-detail-title').textContent='订单详情 · '+order.id;document.getElementById('order-detail-content').innerHTML='<div class="order-detail-meta"><div><span>下单用户</span><strong>'+orderEscape(order.userName)+' · '+orderEscape(order.company)+'</strong></div><div><span>下单时间</span><strong>'+order.createdAt+'</strong></div><div><span>订单状态</span><strong><span class="order-status '+orderStatusClass(order.status)+'">'+order.status+'</span></strong></div><div><span>物流信息</span><strong>'+orderEscape(order.logistics)+' · '+(order.tracking||'暂未生成')+'</strong></div><div class="wide"><span>收货信息</span><strong>'+orderEscape(order.recipient)+' · '+orderEscape(order.phone)+' · '+orderEscape(order.address)+'</strong></div></div><h4>SKU明细</h4><div class="table-scroll"><table class="data-table order-detail-items"><thead><tr><th>SKU</th><th>单价</th><th>数量</th><th>小计</th></tr></thead><tbody>'+order.items.map(function(item){return '<tr><td><div class="order-detail-sku"><img src="'+orderEscape(item.img)+'" alt=""><div><strong>'+orderEscape(item.name)+'</strong><span>'+orderEscape(item.spec)+' · '+orderEscape(item.sku)+'</span></div></div></td><td>'+orderMoney(item.unitPrice)+'</td><td>'+item.quantity+'</td><td>'+orderMoney(item.subtotal)+'</td></tr>'}).join('')+'</tbody></table></div><div class="order-detail-bottom"><div><h4>费用明细</h4><p><span>商品金额</span><strong>'+orderMoney(order.productAmount)+'</strong></p><p><span>操作费</span><strong>'+orderMoney(order.operationFee)+'</strong></p><p><span>物流费</span><strong>'+orderMoney(order.logisticsFee)+'</strong></p><p class="total"><span>订单金额</span><strong>'+orderMoney(order.amount)+'</strong></p></div><div><h4>物流跟踪</h4><ol class="order-timeline"><li class="done">订单已提交</li><li class="'+(order.status!=='待确认'&&order.status!=='已取消'?'done':'')+'">订单已确认</li><li class="'+(['拣货中','已发货','已签收'].indexOf(order.status)>-1?'done':'')+'">仓库拣货</li><li class="'+(['已发货','已签收'].indexOf(order.status)>-1?'done':'')+'">包裹已发货</li><li class="'+(order.status==='已签收'?'done':'')+'">客户已签收</li></ol></div></div><p class="order-detail-qty">共 '+order.items.length+' 个SKU / '+totalQty+' 件</p>';document.getElementById('order-detail-modal').classList.add('open')}
function closeOrderDetail(){document.getElementById('order-detail-modal').classList.remove('open')}
function openOrderAction(type,id){var order=findOrder(id);if(!order)return;orderAction={type:type,id:id};document.getElementById('order-reason-field').hidden=type!=='reject';document.getElementById('order-tracking-field').hidden=type!=='ship';document.getElementById('order-reject-reason').value='';document.getElementById('order-tracking-input').value=order.tracking||'';var titles={confirm:'确认订单',reject:'拒绝订单',ship:'标记已发货'};var copies={confirm:'确认后将预占（锁定）库存，并推送 OMS 创建包裹。',reject:'拒绝后将释放该订单预占库存，请填写拒绝原因。',ship:'请输入仓库发货后的物流单号，确认后订单状态将更新为已发货。'};document.getElementById('order-action-title').textContent=titles[type];document.getElementById('order-action-copy').textContent=copies[type];document.getElementById('order-action-confirm').textContent=type==='ship'?'确认发货':'确认';document.getElementById('order-action-modal').classList.add('open');if(type==='reject')document.getElementById('order-reject-reason').focus();else if(type==='ship')document.getElementById('order-tracking-input').focus()}
function closeOrderAction(){document.getElementById('order-action-modal').classList.remove('open')}
function submitOrderAction(){var order=findOrder(orderAction.id);if(!order)return;if(orderAction.type==='confirm'){order.status='已确认';showToast('订单已确认，库存已预占并已推送 OMS')}if(orderAction.type==='reject'){var reason=document.getElementById('order-reject-reason').value.trim();if(!reason){showToast('请输入拒绝原因','warning');return}order.status='已取消';order.rejectReason=reason;showToast('订单已拒绝，预占库存已释放')}if(orderAction.type==='ship'){var tracking=document.getElementById('order-tracking-input').value.trim();if(!tracking){showToast('请输入物流单号','warning');return}order.status='已发货';order.tracking=tracking;showToast('订单已标记为已发货')}closeOrderAction();updateOrderStats();applyOrderFilters()}
document.getElementById('order-search').addEventListener('click',applyOrderFilters);document.getElementById('order-reset').addEventListener('click',resetOrderFilters);document.querySelector('.ops-filter-bar').addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();applyOrderFilters()}});document.getElementById('order-prev').addEventListener('click',function(){orderPage=Math.max(1,orderPage-1);renderOrders()});document.getElementById('order-next').addEventListener('click',function(){orderPage++;renderOrders()});document.getElementById('order-tbody').addEventListener('click',function(event){var detail=event.target.closest('[data-order-detail]');if(detail){openOrderDetail(detail.dataset.orderDetail);return}var action=event.target.closest('[data-order-action]');if(action)openOrderAction(action.dataset.orderAction,action.dataset.orderId)});document.querySelectorAll('[data-order-detail-close]').forEach(function(button){button.addEventListener('click',closeOrderDetail)});document.getElementById('order-detail-modal').addEventListener('click',function(event){if(event.target===this)closeOrderDetail()});document.getElementById('order-action-close').addEventListener('click',closeOrderAction);document.getElementById('order-action-cancel').addEventListener('click',closeOrderAction);document.getElementById('order-action-confirm').addEventListener('click',submitOrderAction);document.getElementById('order-action-modal').addEventListener('click',function(event){if(event.target===this)closeOrderAction()});document.addEventListener('keydown',function(event){if(event.key==='Escape'){closeOrderDetail();closeOrderAction()}});var requestedUser=new URLSearchParams(location.search).get('user')||'';if(requestedUser)document.getElementById('order-filter-user').value=requestedUser;updateOrderStats();applyOrderFilters();
</script><script src="toast.js?v=20260827-global"></script><script src="role-switch.js"></script><script src="notes.js?v=20260827-resize"></script>
</body></html>
