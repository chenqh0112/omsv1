<!DOCTYPE html>
<html lang="zh-CN"><head>

<div class="app-content">
  <div class="topbar"><div class="topbar-left"><h1>订单管理</h1></div><div class="topbar-right"><div class="user"><button class="avatar" type="button" data-role-avatar aria-haspopup="dialog" aria-label="切换身份" title="切换身份">超</button></div></div></div>
  <main class="page-body ops-page-body">
    <section class="ops-stat-grid page-section" aria-label="订单统计">
      <div class="stat-card ops-stat ops-stat-pending"><div class="stat-heading"><div class="stat-label">待审核订单</div><p>触发风控规则，等待人工审核</p></div><div class="stat-metric-row"><div class="stat-value" id="order-stat-pending">0</div><div class="stat-trend trend-good-down"><strong>↓ 12.0%</strong><span>vs 上周</span></div></div></div>
      <div class="stat-card ops-stat ops-stat-processing"><div class="stat-heading"><div class="stat-label">处理中</div><p>OMS 正在分仓、拣货或等待收揽</p></div><div class="stat-metric-row"><div class="stat-value" id="order-stat-processing">0</div><div class="stat-trend trend-up"><strong>↑ 8.4%</strong><span>vs 上周</span></div></div></div>
      <div class="stat-card ops-stat ops-stat-shipped"><div class="stat-heading"><div class="stat-label">已发货</div><p>已出库等待签收</p></div><div class="stat-metric-row"><div class="stat-value" id="order-stat-shipped">0</div><div class="stat-trend trend-up"><strong>↑ 15.6%</strong><span>vs 上周</span></div></div></div>
      <div class="stat-card ops-stat ops-stat-revenue"><div class="stat-heading"><div class="stat-label">本月订单金额</div><p>本月非取消订单金额</p></div><div class="stat-metric-row"><div class="stat-value" id="order-stat-revenue">$0.00</div><div class="stat-trend trend-up"><strong>↑ 12.8%</strong><span>vs 上月同期</span></div></div></div>
    </section>
    <section class="filter-bar ops-filter-bar page-section" aria-label="订单筛选">
      <div class="filter-group"><label for="order-filter-id">订单号</label><input id="order-filter-id" type="text" placeholder="请输入订单号" autocomplete="off"></div>
      <div class="filter-group"><label for="order-filter-user">下单用户</label><input id="order-filter-user" type="text" placeholder="请输入用户名" autocomplete="off"></div>
      <div class="filter-group"><label for="order-filter-phone">手机号</label><input id="order-filter-phone" type="text" placeholder="请输入手机号" inputmode="tel" autocomplete="off"></div>
      <div class="filter-group"><label for="order-filter-status">订单状态</label><select id="order-filter-status"><option value="">全部</option><option>待审核</option><option>待分配仓库</option><option>待仓库拣货</option><option>待物流收揽</option><option>部分发货</option><option>已发货</option><option>商品缺货</option><option>已关闭</option><option>拦截发货成功</option></select></div>

    </section>
    <section class="table-wrap ops-table-wrap page-section"><div class="table-head-bar"><h3>订单列表</h3><span class="result-count" id="order-result-count">共 0 条</span></div><div class="table-scroll"><table class="data-table order-admin-table"><thead><tr><th>订单号</th><th>下单用户</th><th>下单时间</th><th>SKU明细</th><th>订单金额</th><th>订单状态</th><th>物流单号</th><th class="operation-column">操作</th></tr></thead><tbody id="order-tbody"></tbody></table></div><div class="pagination"><span class="pagination-info">共 <strong id="order-total-count">0</strong> 条</span><div class="pagination-btns"><button class="page-btn" id="order-prev" type="button">‹</button><button class="page-btn active" id="order-current" type="button">1</button><button class="page-btn" id="order-next" type="button">›</button></div></div></section>
  </main>
</div>
<div class="modal-overlay" id="order-detail-modal" role="dialog" aria-modal="true" aria-labelledby="order-detail-title"><div class="modal order-detail-modal"><div class="modal-head"><h3 id="order-detail-title">订单详情</h3><button class="close" type="button" data-order-detail-close aria-label="关闭">&times;</button></div><div class="modal-body" id="order-detail-content"></div><div class="modal-footer"><button class="btn btn-primary" type="button" data-order-detail-close>关闭</button></div></div></div>
<div class="modal-overlay" id="order-action-modal" role="dialog" aria-modal="true" aria-labelledby="order-action-title"><div class="modal order-action-modal"><div class="modal-head"><h3 id="order-action-title">审核订单</h3><button class="close" type="button" id="order-action-close" aria-label="关闭">&times;</button></div><div class="modal-body"><p class="order-action-copy" id="order-action-copy"></p><div class="order-review-rules" id="order-review-rules"></div><div class="manage-form-field" id="order-reason-field" hidden><label for="order-reject-reason">关闭原因</label><textarea id="order-reject-reason" rows="3" placeholder="请输入关闭原因"></textarea></div><div id="order-tracking-field" hidden><input id="order-tracking-input" type="hidden"></div></div><div class="modal-footer"><button class="btn btn-ghost" type="button" id="order-action-cancel">取消</button><button class="btn btn-primary" type="button" id="order-action-confirm">确认</button></div></div></div>
<script src="sku-data.js"></script><script src="order-data.js?v=20260901-stable-user-id"></script>
<script>
var orderData=(window.OMS_ORDER_DATA||[]).map(function(order){return Object.assign({},order,{items:order.items.map(function(item){return Object.assign({},item)})})});try{JSON.parse(localStorage.getItem('oms-v2-created-orders')||'[]').forEach(function(order){if(!orderData.some(function(item){return item.idempotencyKey===order.idempotencyKey}))orderData.unshift(order)})}catch(error){}var orderFiltered=orderData.slice();var orderPage=1;var orderPageSize=8;var orderAction={type:'',id:''};var requestedUserId=new URLSearchParams(location.search).get('userId')||'';
function orderEscape(value){return String(value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}function orderMoney(value){return '$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function orderStatusClass(status){return 'order-status-'+({待审核:'review',待分配仓库:'allocating',待仓库拣货:'warehouse',待物流收揽:'pickup',部分发货:'shipped',已发货:'shipped',商品缺货:'outofstock',已关闭:'closed',拦截发货成功:'intercepted'}[status]||'review')}function findOrder(id){return orderData.find(function(order){return order.id===id})}
function updateOrderStats(){document.getElementById('order-stat-pending').textContent=orderData.filter(function(order){return order.status==='待审核'}).length;document.getElementById('order-stat-processing').textContent=orderData.filter(function(order){return ['待分配仓库','待仓库拣货','待物流收揽'].indexOf(order.status)>-1}).length;document.getElementById('order-stat-shipped').textContent=orderData.filter(function(order){return order.status==='已发货'||order.status==='部分发货'}).length;document.getElementById('order-stat-revenue').textContent=orderMoney(orderData.filter(function(order){return order.createdAt.indexOf('2026-08')===0&&order.status!=='已关闭'}).reduce(function(sum,order){return sum+order.amount},0))}
function orderLogisticsSummary(order){var packages=order.packages||[];if(packages.length>1)return '<span class="v2-logistics-copy"><strong>'+packages.length+' 个包裹</strong><small>'+orderEscape(order.status)+'</small></span>';var pkg=packages[0];return '<code>'+orderEscape(pkg&&pkg.tracking||order.tracking||'-')+'</code>'}
function orderSkuSummary(order){var total=order.items.reduce(function(sum,item){return sum+item.quantity},0);return '<button class="order-sku-summary" type="button" data-order-detail="'+order.id+'"><strong>'+orderEscape(order.items[0].name)+'</strong><span>'+order.items.length+' 个SKU / '+total+' 件 · 查看</span></button>'}
function orderActions(order){var actions=[];if(order.status==='待审核')actions.push('<button class="btn-link" type="button" data-order-action="approve" data-order-id="'+order.id+'">审核通过</button>','<button class="btn-link danger" type="button" data-order-action="close" data-order-id="'+order.id+'">关闭订单</button>');actions.push('<button class="btn-link" type="button" data-order-detail="'+order.id+'">查看详情</button>');return '<div class="table-actions">'+actions.join('')+'</div>'}
function renderOrders(){var pages=Math.max(1,Math.ceil(orderFiltered.length/orderPageSize));orderPage=Math.min(orderPage,pages);var pageData=orderFiltered.slice((orderPage-1)*orderPageSize,orderPage*orderPageSize);document.getElementById('order-tbody').innerHTML=pageData.length?pageData.map(function(order){return '<tr><td><code class="order-id">'+orderEscape(order.localOrderNo||order.id)+'</code></td><td><div class="order-user-cell"><strong>'+orderEscape(order.userName)+'</strong><span>'+orderEscape(order.phone||'-')+'</span></div></td><td>'+order.createdAt+'</td><td>'+orderSkuSummary(order)+'</td><td class="num"><strong>'+orderMoney(order.amount)+'</strong></td><td><span class="order-status '+orderStatusClass(order.status)+'">'+order.status+'</span></td><td>'+orderLogisticsSummary(order)+'</td><td class="operation-column">'+orderActions(order)+'</td></tr>'}).join(''):'<tr><td colspan="8" class="mark-table-empty">暂无匹配订单</td></tr>';document.getElementById('order-result-count').textContent='共 '+orderFiltered.length+' 条';document.getElementById('order-total-count').textContent=orderFiltered.length;document.getElementById('order-current').textContent=orderPage;document.getElementById('order-prev').disabled=orderPage<=1;document.getElementById('order-next').disabled=orderPage>=pages||orderFiltered.length===0}
function applyOrderFilters(){var id=document.getElementById('order-filter-id').value.trim().toLowerCase();var user=document.getElementById('order-filter-user').value.trim().toLowerCase();var phone=document.getElementById('order-filter-phone').value.trim().toLowerCase();var status=document.getElementById('order-filter-status').value;orderFiltered=orderData.filter(function(order){return (!requestedUserId||order.userId===requestedUserId)&&(!id||String(order.localOrderNo||order.id).toLowerCase().indexOf(id)>-1||String(order.omsOrderNo||'').toLowerCase().indexOf(id)>-1)&&(!user||order.userName.toLowerCase().indexOf(user)>-1)&&(!phone||String(order.phone||'').toLowerCase().indexOf(phone)>-1)&&(!status||order.status===status)});orderPage=1;renderOrders()}function resetOrderFilters(){document.getElementById('order-filter-id').value='';document.getElementById('order-filter-user').value='';document.getElementById('order-filter-phone').value='';document.getElementById('order-filter-status').value='';applyOrderFilters()}
function openOrderDetail(id){var order=findOrder(id);if(!order)return;var totalQty=order.items.reduce(function(sum,item){return sum+item.quantity},0);document.getElementById('order-detail-title').textContent='订单详情 · '+(order.localOrderNo||order.id);document.getElementById('order-detail-content').innerHTML='<div class="order-detail-meta"><div><span>下单用户</span><strong>'+orderEscape(order.userName)+'</strong></div><div><span>下单时间</span><strong>'+order.createdAt+'</strong></div><div><span>订单状态</span><strong><span class="order-status '+orderStatusClass(order.status)+'">'+order.status+'</span></strong></div><div><span>用户ID</span><strong>'+orderEscape(order.userId||'-')+'</strong></div><div class="wide"><span>收货信息</span><strong>'+orderEscape(order.recipient)+' · '+orderEscape(order.phone)+' · '+orderEscape(order.address)+'</strong></div></div><h4>SKU明细</h4><div class="table-scroll"><table class="data-table order-detail-items"><thead><tr><th>SKU</th><th>单价</th><th>数量</th><th>小计</th></tr></thead><tbody>'+order.items.map(function(item){return '<tr><td><div class="order-detail-sku"><img src="'+orderEscape(item.img)+'" alt=""><div><strong>'+orderEscape(item.name)+'</strong><span>'+orderEscape(item.spec)+' · '+orderEscape(item.sku)+'</span></div></div></td><td>'+orderMoney(item.unitPrice)+'</td><td>'+item.quantity+'</td><td>'+orderMoney(item.subtotal)+'</td></tr>'}).join('')+'</tbody></table></div><div class="order-detail-bottom"><div><h4>费用明细</h4><p><span>商品金额</span><strong>'+orderMoney(order.productAmount)+'</strong></p><p><span>操作费</span><strong>'+orderMoney(order.operationFee)+'</strong></p><p><span>物流费</span><strong>'+orderMoney(order.logisticsFee)+'</strong></p><p class="total"><span>订单金额</span><strong>'+orderMoney(order.amount)+'</strong></p></div><div><h4>OMS履约进度</h4><ol class="order-timeline"></ol></div></div><p class="order-detail-qty">共 '+order.items.length+' 个SKU / '+totalQty+' 件</p>';document.getElementById('order-detail-modal').classList.add('open')}
var openOrderDetailBase=openOrderDetail;
openOrderDetail=function(id){
  openOrderDetailBase(id);
  var order=findOrder(id);if(!order)return;
  var content=document.getElementById('order-detail-content');
  content.querySelector('.order-detail-meta').insertAdjacentHTML('afterend','<section class="order-risk-detail"><h4>订单编号</h4><div><span>本站订单号 '+orderEscape(order.localOrderNo||order.id)+'</span><span>OMS订单号 '+orderEscape(order.omsOrderNo||'待生成')+'</span></div></section>');
  if(order.status==='待审核'&&order.reviewReasons&&order.reviewReasons.length){
    content.querySelector('.order-detail-meta').insertAdjacentHTML('afterend','<section class="order-risk-detail"><h4>触发审核规则</h4><div>'+order.reviewReasons.map(function(reason){return '<span>'+orderEscape(reason)+'</span>'}).join('')+'</div></section>');
  }
  var packages=order.packages||[];if(packages.length)content.querySelector('.order-detail-bottom').insertAdjacentHTML('beforebegin','<section class="order-risk-detail"><h4>包裹与物流</h4><div class="v2-package-list">'+packages.map(function(pkg){return '<span>'+orderEscape(pkg.logistics||'待分配物流')+' · '+orderEscape(pkg.packageNo||'-')+' · '+orderEscape(pkg.tracking||'暂无物流单号')+' · '+orderEscape(pkg.status||order.status)+'</span>'}).join('')+'</div></section>');
  var sequence=['待分配仓库','待仓库拣货','待物流收揽','部分发货','已发货'];
  var reached=sequence.indexOf(order.status);if(order.status==='拦截发货成功')reached=2;
  var timeline=content.querySelector('.order-timeline');
  if(timeline){
    timeline.innerHTML='<li class="done">本站订单已创建</li><li class="'+(order.omsOrderNo?'done':'')+'">'+(order.omsOrderNo?'OMS订单已创建并锁定库存':'等待审核，暂未创建OMS订单')+'</li><li class="'+(reached>=0?'done':'')+'">等待分配仓库</li><li class="'+(reached>=1?'done':'')+'">仓库拣货</li><li class="'+(reached>=2?'done':'')+'">等待物流收揽</li><li class="'+(reached>=3?'done':'')+'">部分或全部发货</li>'+(['商品缺货','已关闭','拦截发货成功'].indexOf(order.status)>-1?'<li class="order-timeline-exception">'+order.status+'</li>':'');
  }
};
function closeOrderDetail(){document.getElementById('order-detail-modal').classList.remove('open')}
function openOrderAction(type,id){var order=findOrder(id);if(!order||order.status!=='待审核')return;orderAction={type:type,id:id};document.getElementById('order-reason-field').hidden=type!=='close';document.getElementById('order-tracking-field').hidden=true;document.getElementById('order-reject-reason').value='';var titles={approve:'审核通过',close:'关闭订单'};var copies={approve:'审核通过后，订单进入“待分配仓库”，后续状态由 OMS 自动同步。',close:'关闭后订单不再进入履约，请填写关闭原因。'};document.getElementById('order-action-title').textContent=titles[type];document.getElementById('order-action-copy').textContent=copies[type];document.getElementById('order-review-rules').innerHTML='<strong>触发规则</strong><div>'+((order.reviewReasons&&order.reviewReasons.length)?order.reviewReasons:['待人工复核']).map(function(reason){return '<span>'+orderEscape(reason)+'</span>'}).join('')+'</div>';document.getElementById('order-action-confirm').textContent=type==='approve'?'确认通过':'确认关闭';document.getElementById('order-action-modal').classList.add('open');if(type==='close')document.getElementById('order-reject-reason').focus()}
function closeOrderAction(){document.getElementById('order-action-modal').classList.remove('open')}
function submitOrderAction(){var order=findOrder(orderAction.id);if(!order||order.status!=='待审核')return;if(orderAction.type==='approve'){if(!order.omsOrderNo){var suffix=String(Date.now()).slice(-10);order.omsOrderNo='OMS-'+suffix;order.packages=[{packageNo:'PKG-'+suffix,logistics:order.logistics||'待分配物流',tracking:'',status:'待分配仓库'}]}order.status='待分配仓库';order.reviewedAt=new Date().toLocaleString('zh-CN',{hour12:false});order.reviewReasons=[];showToast('审核通过，OMS订单已按本站业务单号幂等创建')}if(orderAction.type==='close'){var reason=document.getElementById('order-reject-reason').value.trim();if(!reason){showToast('请输入关闭原因','warning');return}order.status='已关闭';order.closeReason=reason;showToast('订单已关闭')}try{var saved=JSON.parse(localStorage.getItem('oms-v2-created-orders')||'[]');var savedOrder=saved.find(function(item){return item.idempotencyKey===order.idempotencyKey});if(savedOrder)Object.assign(savedOrder,order);localStorage.setItem('oms-v2-created-orders',JSON.stringify(saved))}catch(error){}closeOrderAction();updateOrderStats();applyOrderFilters()}
document.getElementById('order-search').addEventListener('click',applyOrderFilters);document.getElementById('order-reset').addEventListener('click',resetOrderFilters);document.querySelector('.ops-filter-bar').addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();applyOrderFilters()}});document.getElementById('order-prev').addEventListener('click',function(){orderPage=Math.max(1,orderPage-1);renderOrders()});document.getElementById('order-next').addEventListener('click',function(){orderPage++;renderOrders()});document.getElementById('order-tbody').addEventListener('click',function(event){var detail=event.target.closest('[data-order-detail]');if(detail){openOrderDetail(detail.dataset.orderDetail);return}var action=event.target.closest('[data-order-action]');if(action)openOrderAction(action.dataset.orderAction,action.dataset.orderId)});document.querySelectorAll('[data-order-detail-close]').forEach(function(button){button.addEventListener('click',closeOrderDetail)});document.getElementById('order-detail-modal').addEventListener('click',function(event){if(event.target===this)closeOrderDetail()});document.getElementById('order-action-close').addEventListener('click',closeOrderAction);document.getElementById('order-action-cancel').addEventListener('click',closeOrderAction);document.getElementById('order-action-confirm').addEventListener('click',submitOrderAction);document.getElementById('order-action-modal').addEventListener('click',function(event){if(event.target===this)closeOrderAction()});document.addEventListener('keydown',function(event){if(event.key==='Escape'){closeOrderDetail();closeOrderAction()}});updateOrderStats();applyOrderFilters();
var renderOrdersBase=renderOrders;renderOrders=function(){renderOrdersBase();var pages=Math.max(1,Math.ceil(orderFiltered.length/orderPageSize));document.getElementById('order-current').textContent=orderPage+' / '+pages};renderOrders();
</script><script src="toast.js?v=20260828-cart-action"></script><script src="role-switch.js"></script><script src="notes.js?v=20260828-local-prd-v2"></script>
</body></html>
