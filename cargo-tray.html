        <div class="stat-trend up"><span class="trend-arrow">↑</span><strong>9%</strong><span>vs 上周</span><span class="table-header-help" tabindex="0" title="与上周同期相比的货盘总量变化">?</span></div>

        <div class="stat-meta-row"><span class="stat-share" id="tray-revenue-share">占比 0.0%</span><span class="table-header-help" tabindex="0" title="当前身份今日成交额除以全部货盘今日成交额">?</span></div>
        <div class="stat-trend up"><span class="trend-arrow">↑</span><strong>14%</strong><span>vs 昨日</span><span class="table-header-help" tabindex="0" title="与昨日同期相比的成交额变化">?</span></div>

    <div class="filter-bar tray-filter-bar page-section">
      <div class="filter-group"><label for="tray-filter-code">SKU编码</label><input type="text" id="tray-filter-code" autocomplete="off"></div>

      <div class="filter-actions tray-search-actions">
        <button class="btn btn-primary" id="tray-search" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>搜索</button>
        <button class="btn btn-ghost" id="tray-reset" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>重置</button>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1"></circle><circle cx="19" cy="20" r="1"></circle><path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6"></path></svg>

        <div class="pagination-btns"><button class="page-btn" id="tray-page-prev" type="button">‹</button><button class="page-btn active" id="tray-page-current" type="button">1</button><button class="page-btn" id="tray-page-next" type="button">›</button></div>

<script src="sku-data.js"></script>
<script src="order-data.js?v=20260901-stable-user-id"></script>
<script src="multi-select.js"></script>
<script>
var trayData=(window.OMS_SKU_DATA||[]).slice();
var currentRole={id:'super-admin'};
var currentTrayVariants=[];
var currentTrayGroups=[];
var trayCurrentPage=1;
var trayPageSize=5;
var traySort={key:'',direction:'desc'};
var selectedSkus={};
var cartItems={};
var statusFilter=null;

function getVisibleTrayData(){
  if(currentRole.id==='company-admin')return trayData.filter(function(item){return item.company==='公司A'});
  if(currentRole.id==='group-admin')return trayData.filter(function(item){return item.company==='公司A'&&item.businessGroup==='业务组A'});
  if(currentRole.id==='salesperson')return trayData.filter(function(item){return item.company==='公司A'&&item.businessGroup==='业务组A'&&item.salesperson==='业务员A'});
  return trayData.slice();
}
function percent(value,base){return base?(value/base*100).toFixed(1):'0.0'}
function sum(data,key){return data.reduce(function(total,item){return total+(Number(item[key])||0)},0)}
function formatMoney(value){return '$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function statusClass(status){return status==='充足'?'status-full':status==='偏少'?'status-low':'status-out'}
function statusRank(status){return status==='缺货'?0:status==='偏少'?1:2}
function maxAge(item){return Math.max.apply(null,(item.ageRecords||[{days:0}]).map(function(record){return record.days}))}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}
function estimateArrival(item){
  var index=trayData.indexOf(item);
  var date=new Date(Date.UTC(2026,7,27+(index%7)+3));
  return date.getUTCFullYear()+'-'+String(date.getUTCMonth()+1).padStart(2,'0')+'-'+String(date.getUTCDate()).padStart(2,'0');
}

function updateTraySummary(){
  var visible=getVisibleTrayData();
  var globalQty=sum(trayData,'trayQuantity');
  var visibleQty=sum(visible,'trayQuantity');
  var sellable=sum(visible,'available');
  var globalRevenue=sum(trayData,'todayRevenue');
  var revenue=sum(visible,'todayRevenue');
  document.getElementById('tray-sku-total').textContent=visible.length;
  document.getElementById('tray-qty-total').textContent=visibleQty.toLocaleString('en-US');
  document.getElementById('tray-sellable-total').textContent=sellable.toLocaleString('en-US');
  document.getElementById('tray-revenue-total').textContent=formatMoney(revenue);
  document.getElementById('tray-sku-share').textContent='占比 '+percent(visible.length,trayData.length)+'%';
  document.getElementById('tray-qty-share').textContent='占比 '+percent(visibleQty,globalQty)+'%';
  document.getElementById('tray-sellable-share').textContent='占比 '+percent(sellable,visibleQty)+'%';
  document.getElementById('tray-revenue-share').textContent='占比 '+percent(revenue,globalRevenue)+'%';
}

function groupTrayData(data){
  var groups={};
  data.forEach(function(item){
    if(!groups[item.name])groups[item.name]={name:item.name,img:item.img,variants:[]};
    groups[item.name].variants.push(item);
  });
  return Object.keys(groups).map(function(name){return groups[name]});
}
function groupStatus(group){
  if(group.variants.some(function(item){return item.sellableStatus==='缺货'}))return '缺货';
  if(group.variants.some(function(item){return item.sellableStatus==='偏少'}))return '偏少';
  return '充足';
}
function groupSortValue(group,key){
  if(key==='trayQuantity'||key==='available')return sum(group.variants,key);
  if(key==='unitPrice')return sum(group.variants,'unitPrice')/group.variants.length;
  if(key==='sellableStatus')return statusRank(groupStatus(group));
  return 0;
}
function sortTrayGroups(groups){
  if(!traySort.key)return groups.slice();
  return groups.slice().sort(function(a,b){
    var difference=groupSortValue(a,traySort.key)-groupSortValue(b,traySort.key);
    if(difference===0)return a.name.localeCompare(b.name,'zh-CN');
    return traySort.direction==='asc'?difference:-difference;
  });
}
function priceRange(variants){
  var prices=variants.map(function(item){return item.unitPrice});
  var low=Math.min.apply(null,prices);
  var high=Math.max.apply(null,prices);
  return low===high?formatMoney(low):formatMoney(low)+' - '+formatMoney(high);
}
function statusBadge(item){
  var eta=item.sellableStatus==='缺货'?estimateArrival(item):'';
  var tooltip=eta?' data-tooltip="预计到货：'+eta+'" tabindex="0" aria-label="缺货，预计到货 '+eta+'"':'';
  return '<span class="status-badge '+statusClass(item.sellableStatus)+'"'+tooltip+'>'+item.sellableStatus+'</span>';
}
function groupStatusBadge(group){
  var status=groupStatus(group);
  if(status!=='缺货')return '<span class="status-badge '+statusClass(status)+'">'+status+'</span>';
  var outItem=group.variants.find(function(item){return item.sellableStatus==='缺货'});
  var eta=estimateArrival(outItem);
  return '<span class="status-badge status-out" data-tooltip="预计到货：'+eta+'" tabindex="0" aria-label="缺货，预计到货 '+eta+'">缺货</span>';
}
function variantStack(variants,renderer,className){
  return '<div class="tray-variant-stack '+(className||'')+'">'+variants.map(function(item){return '<div>'+renderer(item)+'</div>'}).join('')+'</div>';
}
function renderProductGroup(group){
  var groupKey=encodeURIComponent(group.name);
  var groupTotal=sum(group.variants,'trayQuantity');
  var groupAvailable=sum(group.variants,'available');
  var groupMaxAge=Math.max.apply(null,group.variants.map(maxAge));
  var sellableVariants=group.variants.filter(function(item){return item.available>0});
  var groupChecked=sellableVariants.length>0&&sellableVariants.every(function(item){return !!selectedSkus[item.barcode]});
  return '<tr class="tray-product-row">'
    +'<td class="selection-column"><div class="tray-group-summary tray-check-summary"><input type="checkbox" class="tray-group-check" data-group="'+groupKey+'" aria-label="选择 '+escapeHtml(group.name)+' 的可售变体" '+(groupChecked?'checked':'')+(sellableVariants.length?'':' disabled')+'></div>'
      +variantStack(group.variants,function(item){return '<input type="checkbox" class="tray-sku-check" data-sku="'+item.barcode+'" aria-label="选择 '+escapeHtml(item.name+' '+item.spec)+'" '+(selectedSkus[item.barcode]?'checked':'')+(item.available?'':' disabled title="缺货暂不可加入购物车"')+'>'},'tray-check-stack')+'</td>'
    +'<td class="sku-column"><div class="tray-product-summary"><button class="sku-product-image" type="button" aria-label="预览'+escapeHtml(group.name)+'图片" data-preview-src="'+escapeHtml(group.img)+'" data-preview-name="'+escapeHtml(group.name)+'"><img src="'+escapeHtml(group.img)+'" alt="'+escapeHtml(group.name)+'"></button><div><strong>'+escapeHtml(group.name)+'</strong><span>'+group.variants.length+' 个变体</span></div></div>'
      +variantStack(group.variants,function(item){return '<span>'+escapeHtml(item.spec)+'</span><code>'+escapeHtml(item.barcode)+'</code>'},'tray-sku-variant-stack')+'</td>'
    +'<td class="num"><div class="tray-group-summary tray-group-metric"><strong>'+groupTotal.toLocaleString('en-US')+'</strong><span>合计</span></div>'+variantStack(group.variants,function(item){return '<span class="tray-quantity">'+item.trayQuantity.toLocaleString('en-US')+'</span>'})+'</td>'
    +'<td class="num"><div class="tray-group-summary tray-group-metric"><strong>'+priceRange(group.variants)+'</strong><span>价格区间</span></div>'+variantStack(group.variants,function(item){return '<span class="price-cell">'+formatMoney(item.unitPrice)+'</span>'})+'</td>'
    +'<td class="num"><div class="tray-group-summary tray-group-metric"><strong>'+groupAvailable.toLocaleString('en-US')+'</strong><span>合计</span></div>'+variantStack(group.variants,function(item){return '<span class="sellable-cell">'+item.available.toLocaleString('en-US')+'</span>'})+'</td>'
    +'<td><div class="tray-group-summary">'+groupStatusBadge(group)+'</div>'+variantStack(group.variants,statusBadge,'tray-status-stack')+'</td>'
    +'<td><div class="tray-group-summary tray-group-metric"><strong>'+groupMaxAge+' 天</strong><span>最长库龄</span></div>'+variantStack(group.variants,function(item){return '<span>'+maxAge(item)+' 天</span>'})+'</td>'
    +'<td class="operation-column"><div class="tray-group-summary"><span class="tray-operation-label">按SKU操作</span></div>'+variantStack(group.variants,function(item){return '<div class="tray-variant-actions"><button class="btn-link" type="button" data-cart-sku="'+item.barcode+'" '+(item.available?'':'disabled')+'>加入购物车</button><button class="btn-link" type="button" data-order-sku="'+item.barcode+'" '+(item.available?'':'disabled')+'>下单</button></div>'},'tray-operation-stack')+'</td>'
    +'</tr>';
}

function renderTrayTable(){
  var totalPages=Math.max(1,Math.ceil(currentTrayGroups.length/trayPageSize));
  trayCurrentPage=Math.min(trayCurrentPage,totalPages);
  var pageGroups=currentTrayGroups.slice((trayCurrentPage-1)*trayPageSize,trayCurrentPage*trayPageSize);
  var tbody=document.getElementById('overview-tbody');
  tbody.innerHTML=pageGroups.length?pageGroups.map(renderProductGroup).join(''):'<tr><td colspan="8" class="mark-table-empty">暂无匹配的SKU</td></tr>';
  document.getElementById('tray-row-count').textContent=currentTrayVariants.length;
  document.getElementById('tray-group-count').textContent=currentTrayGroups.length;
  document.getElementById('tray-page-current').textContent=trayCurrentPage;
  document.getElementById('tray-page-prev').disabled=trayCurrentPage<=1;
  document.getElementById('tray-page-next').disabled=trayCurrentPage>=totalPages||currentTrayGroups.length===0;
  syncSelectionUI();
}
function applyTrayFilters(){
  var code=document.getElementById('tray-filter-code').value.trim().toLowerCase();
  var name=document.getElementById('tray-filter-name').value.trim().toLowerCase();
  var statuses=statusFilter?statusFilter.getValues():['all'];
  var includeAll=statuses.length===0||statuses.indexOf('all')>-1;
  currentTrayVariants=getVisibleTrayData().filter(function(item){
    return (!code||item.barcode.toLowerCase().indexOf(code)>-1)
      &&(!name||item.name.toLowerCase().indexOf(name)>-1)
      &&(includeAll||statuses.indexOf(item.sellableStatus)>-1);
  });
  trayCurrentPage=1;
  currentTrayGroups=sortTrayGroups(groupTrayData(currentTrayVariants));
  renderTrayTable();
}
function resetTrayFilters(){
  document.getElementById('tray-filter-code').value='';
  document.getElementById('tray-filter-name').value='';
  statusFilter.setValues(['all'],true);
  traySort={key:'',direction:'desc'};
  updateSortHeaders();
  applyTrayFilters();
}
function changeTrayPage(offset){
  var totalPages=Math.max(1,Math.ceil(currentTrayGroups.length/trayPageSize));
  trayCurrentPage=Math.min(totalPages,Math.max(1,trayCurrentPage+offset));
  renderTrayTable();
}
function setTraySort(key){
  if(traySort.key===key)traySort.direction=traySort.direction==='asc'?'desc':'asc';
  else traySort={key:key,direction:key==='sellableStatus'?'asc':'desc'};
  currentTrayGroups=sortTrayGroups(groupTrayData(currentTrayVariants));
  trayCurrentPage=1;
  updateSortHeaders();
  renderTrayTable();
}
function updateSortHeaders(){
  document.querySelectorAll('.sort-button').forEach(function(button){
    var active=button.dataset.sortKey===traySort.key;
    button.parentElement.setAttribute('aria-sort',active?(traySort.direction==='asc'?'ascending':'descending'):'none');
    button.classList.toggle('active',active);
    button.querySelector('span').textContent=active?(traySort.direction==='asc'?'↑':'↓'):'↕';
  });
}

function currentPageGroups(){return currentTrayGroups.slice((trayCurrentPage-1)*trayPageSize,trayCurrentPage*trayPageSize)}
function currentPageSellableSkus(){
  return currentPageGroups().reduce(function(items,group){return items.concat(group.variants.filter(function(item){return item.available>0}))},[]);
}
function findGroup(encodedName){
  var name=decodeURIComponent(encodedName);
  return currentTrayGroups.find(function(group){return group.name===name});
}
function syncSelectionUI(){
  document.querySelectorAll('.tray-sku-check').forEach(function(checkbox){checkbox.checked=!!selectedSkus[checkbox.dataset.sku]});
  document.querySelectorAll('.tray-group-check').forEach(function(checkbox){
    var group=findGroup(checkbox.dataset.group);
    if(!group)return;
    var sellable=group.variants.filter(function(item){return item.available>0});
    var selectedCount=sellable.filter(function(item){return !!selectedSkus[item.barcode]}).length;
    checkbox.checked=sellable.length>0&&selectedCount===sellable.length;
    checkbox.indeterminate=selectedCount>0&&selectedCount<sellable.length;
  });
  var pageSkus=currentPageSellableSkus();
  var pageSelected=pageSkus.filter(function(item){return !!selectedSkus[item.barcode]}).length;
  var selectAll=document.getElementById('tray-select-all');
  selectAll.checked=pageSkus.length>0&&pageSelected===pageSkus.length;
  selectAll.indeterminate=pageSelected>0&&pageSelected<pageSkus.length;
  document.getElementById('tray-add-selected').disabled=Object.keys(selectedSkus).length===0;
}
function toggleSkuSelection(sku,checked){
  if(checked)selectedSkus[sku]=true;
  else delete selectedSkus[sku];
  syncSelectionUI();
}
function toggleGroupSelection(group,checked){
  group.variants.forEach(function(item){if(item.available){if(checked)selectedSkus[item.barcode]=true;else delete selectedSkus[item.barcode]}});
  syncSelectionUI();
}

function addItemsToCart(items){
  var added=0;
  items.forEach(function(item){
    if(!item||item.available<=0)return;
    if(!cartItems[item.barcode])cartItems[item.barcode]={item:item,quantity:1};
    else cartItems[item.barcode].quantity=Math.min(item.available,cartItems[item.barcode].quantity+1);
    added++;
  });
  if(!added){showToast('没有可加入购物车的SKU','error');return}
  selectedSkus={};
  updateCart();
  syncSelectionUI();
  showToast('已加入购物车','success',{label:'查看购物车',onClick:openCart});
}
function cartTotals(){
  return Object.keys(cartItems).reduce(function(result,sku){
    var entry=cartItems[sku];
    result.count+=entry.quantity;
    result.total+=entry.item.unitPrice*entry.quantity;
    return result;
  },{count:0,total:0});
}
function updateCart(){
  var totals=cartTotals();
  document.getElementById('tray-cart-subtotal').textContent=totals.count+' 件';
  document.getElementById('tray-cart-total').textContent=formatMoney(totals.total);
  document.getElementById('tray-cart-badge').textContent=totals.count;
  document.getElementById('tray-cart-modal-count').textContent=totals.count+' 件';
  document.getElementById('tray-cart-modal-total').textContent=formatMoney(totals.total);
  var entries=Object.keys(cartItems).map(function(sku){return cartItems[sku]});
  document.getElementById('tray-cart-list').innerHTML=entries.length?entries.map(function(entry){
    var item=entry.item;
    return '<div class="tray-cart-item" data-cart-sku="'+item.barcode+'"><img src="'+escapeHtml(item.img)+'" alt=""><div class="tray-cart-item-copy"><strong>'+escapeHtml(item.name)+'</strong><span>'+escapeHtml(item.spec)+' · '+escapeHtml(item.barcode)+'</span><b>'+formatMoney(item.unitPrice)+'</b></div><label>数量<input type="number" min="1" max="'+item.available+'" value="'+entry.quantity+'" aria-label="'+escapeHtml(item.name+' '+item.spec)+'数量"></label><button class="cart-remove" type="button" aria-label="移除 '+escapeHtml(item.name+' '+item.spec)+'" title="移除">&times;</button></div>';
  }).join(''):'<div class="tray-cart-empty">购物车为空</div>';
}
function openCart(){updateCart();document.getElementById('tray-cart-modal').classList.add('open');document.getElementById('tray-cart-close').focus()}
function closeCart(){document.getElementById('tray-cart-modal').classList.remove('open')}
function clearCart(){cartItems={};updateCart();showToast('购物车已清空')}

function openProductPreview(src,name){
  var preview=document.getElementById('product-preview');
  document.getElementById('product-preview-image').src=src;
  document.getElementById('product-preview-image').alt=name;
  document.getElementById('product-preview-caption').textContent=name;
  preview.classList.add('open');
  document.querySelector('.product-preview-close').focus();
}
function closeProductPreview(){document.getElementById('product-preview').classList.remove('open');document.getElementById('product-preview-image').src=''}

statusFilter=OMSMultiSelect.create(document.getElementById('tray-filter-status'),{
  placeholder:'全部',
  allValue:'all',
  defaultValues:['all'],
  options:[{value:'all',label:'全部'},{value:'缺货',label:'缺货'},{value:'偏少',label:'偏少'},{value:'充足',label:'充足'}],
  onChange:function(){applyTrayFilters()}
});
document.getElementById('tray-search').addEventListener('click',applyTrayFilters);
document.getElementById('tray-reset').addEventListener('click',resetTrayFilters);
document.getElementById('tray-filter-code').addEventListener('keydown',function(event){if(event.key==='Enter')applyTrayFilters()});
document.getElementById('tray-filter-name').addEventListener('keydown',function(event){if(event.key==='Enter')applyTrayFilters()});
document.querySelectorAll('.sort-button').forEach(function(button){button.addEventListener('click',function(){setTraySort(button.dataset.sortKey)})});
document.getElementById('tray-page-prev').addEventListener('click',function(){changeTrayPage(-1)});
document.getElementById('tray-page-next').addEventListener('click',function(){changeTrayPage(1)});
document.getElementById('tray-select-all').addEventListener('change',function(event){var checked=event.target.checked;currentPageSellableSkus().forEach(function(item){if(checked)selectedSkus[item.barcode]=true;else delete selectedSkus[item.barcode]});syncSelectionUI()});
document.getElementById('tray-add-selected').addEventListener('click',function(){addItemsToCart(Object.keys(selectedSkus).map(function(sku){return trayData.find(function(item){return item.barcode===sku})}))});
document.getElementById('overview-tbody').addEventListener('change',function(event){
  if(event.target.classList.contains('tray-sku-check'))toggleSkuSelection(event.target.dataset.sku,event.target.checked);
  if(event.target.classList.contains('tray-group-check')){var group=findGroup(event.target.dataset.group);if(group)toggleGroupSelection(group,event.target.checked)}
});
document.getElementById('overview-tbody').addEventListener('click',function(event){
  var previewButton=event.target.closest('[data-preview-src]');
  if(previewButton){openProductPreview(previewButton.dataset.previewSrc,previewButton.dataset.previewName);return}
  var cartButton=event.target.closest('[data-cart-sku]');
  if(cartButton){var cartItem=trayData.find(function(item){return item.barcode===cartButton.dataset.cartSku});if(cartItem)addItemsToCart([cartItem]);return}
  if(event.target.closest('[data-order-sku]'))showToast('下单功能暂未开放');
});
document.querySelector('.product-preview-close').addEventListener('click',closeProductPreview);
document.getElementById('product-preview').addEventListener('click',function(event){if(event.target===this)closeProductPreview()});
document.getElementById('tray-cart-toggle').addEventListener('click',openCart);
document.getElementById('tray-cart-close').addEventListener('click',closeCart);
document.getElementById('tray-cart-modal').addEventListener('click',function(event){if(event.target===this)closeCart()});
document.getElementById('tray-cart-clear').addEventListener('click',clearCart);
document.getElementById('tray-cart-order').addEventListener('click',function(){showToast('下单功能暂未开放')});
document.getElementById('tray-cart-list').addEventListener('input',function(event){
  var itemRow=event.target.closest('[data-cart-sku]');
  if(!itemRow||event.target.type!=='number')return;
  var entry=cartItems[itemRow.dataset.cartSku];
  if(!entry)return;
  entry.quantity=Math.max(1,Math.min(entry.item.available,Number(event.target.value)||1));
  event.target.value=entry.quantity;
  updateCart();
});
document.getElementById('tray-cart-list').addEventListener('click',function(event){
  var removeButton=event.target.closest('.cart-remove');
  if(!removeButton)return;
  var itemRow=removeButton.closest('[data-cart-sku]');
  delete cartItems[itemRow.dataset.cartSku];
  updateCart();
  showToast('已移出购物车');
});
document.addEventListener('keydown',function(event){
  if(event.key!=='Escape')return;
  if(document.getElementById('product-preview').classList.contains('open'))closeProductPreview();
  if(document.getElementById('tray-cart-modal').classList.contains('open'))closeCart();
});
window.addEventListener('oms-role-change',function(event){
  currentRole=event.detail.role;
  selectedSkus={};
  cartItems={};
  updateTraySummary();
  updateCart();
  applyTrayFilters();
});

updateTraySummary();
updateCart();
applyTrayFilters();

</script>
