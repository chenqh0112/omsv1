<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>用户管理 — 独立站</title><link rel="stylesheet" href="styles.css?v=20260828-returns-pagination"><script src="navigation.js?v=20260828-returns" defer></script>
</head><body data-page="users">
<aside class="app-nav"><div class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>独立站</div><nav class="nav-list"></nav><div class="nav-footer">独立站</div></aside>
<div class="app-content">
  <div class="topbar"><div class="topbar-left"><h1>用户管理</h1></div><div class="topbar-right"><button class="btn btn-primary user-create-top" id="user-create" type="button">手动创建用户</button><div class="user"><button class="avatar" type="button" data-role-avatar aria-haspopup="dialog" aria-label="切换身份" title="切换身份">超</button></div></div></div>
  <main class="page-body ops-page-body">
    <section class="ops-stat-grid page-section" aria-label="用户统计">
      <div class="stat-card ops-stat user-stat-total"><div class="stat-heading"><div class="stat-label">总用户数</div><p>平台注册用户总数</p></div><div class="stat-metric-row"><div class="stat-value" id="user-stat-total">0</div><div class="stat-trend trend-up"><strong>↑ 9.2%</strong><span>vs 上月</span></div></div></div>
      <div class="stat-card ops-stat user-stat-active"><div class="stat-heading"><div class="stat-label">活跃用户</div><p>30天内有登录记录</p></div><div class="stat-metric-row"><div class="stat-value" id="user-stat-active">0</div><div class="stat-trend trend-up"><strong>↑ 6.8%</strong><span>vs 上月</span></div></div></div>
      <div class="stat-card ops-stat user-stat-new"><div class="stat-heading"><div class="stat-label">本月新增</div><p>本月新注册用户</p></div><div class="stat-metric-row"><div class="stat-value" id="user-stat-new">0</div><div class="stat-trend trend-up"><strong>↑ 18.5%</strong><span>vs 上月同期</span></div></div></div>
      <div class="stat-card ops-stat user-stat-frozen"><div class="stat-heading"><div class="stat-label">已冻结</div><p>当前无法登录的账号</p></div><div class="stat-metric-row"><div class="stat-value" id="user-stat-frozen">0</div><div class="stat-trend trend-good-down"><strong>↓ 4.1%</strong><span>vs 上月</span></div></div></div>
    </section>
    <section class="filter-bar ops-filter-bar page-section" aria-label="用户筛选">
      <div class="filter-group"><label for="user-filter-keyword">用户名/公司</label><input id="user-filter-keyword" type="text" placeholder="请输入用户名或公司" autocomplete="off"></div>
      <div class="filter-group"><label for="user-filter-type">用户类型</label><select id="user-filter-type"><option value="">全部</option><option>B2B分销商</option><option>外部客户</option></select></div>
      <div class="filter-group"><label for="user-filter-status">账号状态</label><select id="user-filter-status"><option value="">全部</option><option>正常</option><option>冻结</option></select></div>
      <div class="filter-actions"><button class="btn btn-primary" id="user-search" type="button">搜索</button><button class="btn btn-ghost" id="user-reset" type="button">重置</button></div>
    </section>
    <section class="table-wrap ops-table-wrap page-section"><div class="table-head-bar"><h3>用户列表</h3><span class="result-count" id="user-result-count">共 0 条</span></div><div class="table-scroll"><table class="data-table user-admin-table"><thead><tr><th>用户名</th><th>联系方式</th><th>注册时间</th><th>最近登录</th><th>账号状态</th><th>关联订单数</th><th>累计消费</th><th class="operation-column">操作</th></tr></thead><tbody id="user-tbody"></tbody></table></div><div class="pagination"><span class="pagination-info">共 <strong id="user-total-count">0</strong> 条</span><div class="pagination-btns"><button class="page-btn" id="user-prev" type="button">‹</button><button class="page-btn active" id="user-current" type="button">1 / 1</button><button class="page-btn" id="user-next" type="button">›</button></div></div></section>
  </main>
</div>
<div class="modal-overlay" id="user-form-modal" role="dialog" aria-modal="true" aria-labelledby="user-form-title"><div class="modal user-form-modal"><div class="modal-head"><h3 id="user-form-title">手动创建用户</h3><button class="close" type="button" id="user-form-close" aria-label="关闭">&times;</button></div><div class="modal-body"><form class="user-form-grid" id="user-form">
  <input id="user-form-id" type="hidden"><div class="manage-form-field"><label for="user-form-name">用户名</label><input id="user-form-name" type="text" placeholder="请输入用户名"></div><div class="manage-form-field"><label for="user-form-company">公司</label><input id="user-form-company" type="text" placeholder="请输入所属公司"></div>
  <div class="manage-form-field"><label for="user-form-type">用户类型</label><select id="user-form-type"><option>B2B分销商</option><option>外部客户</option></select></div><div class="manage-form-field"><label for="user-form-status">账号状态</label><select id="user-form-status"><option>正常</option><option>冻结</option></select></div>
  <div class="manage-form-field"><label for="user-form-email">邮箱</label><input id="user-form-email" type="email" placeholder="name@company.com"></div><div class="manage-form-field"><label for="user-form-phone">电话</label><input id="user-form-phone" type="text" placeholder="请输入联系电话"></div>
</form></div><div class="modal-footer"><button class="btn btn-ghost" type="button" id="user-form-cancel">取消</button><button class="btn btn-primary" type="button" id="user-form-submit">确认创建</button></div></div></div>
<div class="modal-overlay" id="user-status-modal" role="dialog" aria-modal="true" aria-labelledby="user-status-title"><div class="modal user-status-modal"><div class="modal-head"><h3 id="user-status-title">冻结用户</h3><button class="close" type="button" id="user-status-close" aria-label="关闭">&times;</button></div><div class="modal-body"><p id="user-status-copy"></p><div class="user-status-warning" id="user-status-warning"></div></div><div class="modal-footer"><button class="btn btn-ghost" type="button" id="user-status-cancel">取消</button><button class="btn btn-primary" type="button" id="user-status-confirm">确认</button></div></div></div>
<script src="sku-data.js"></script><script src="order-data.js"></script><script src="user-data.js"></script>
<script>
var userData=(window.OMS_USER_DATA||[]).map(function(user){return Object.assign({},user)});var userFiltered=userData.slice();var userPage=1;var userPageSize=8;var pendingUserStatusId='';
function userEscape(value){return String(value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}function userMoney(value){return '$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function findUser(id){return userData.find(function(user){return user.id===id})}
function updateUserStats(){document.getElementById('user-stat-total').textContent=userData.length;document.getElementById('user-stat-active').textContent=userData.filter(function(user){return user.lastLogin>='2026-07-28'}).length;document.getElementById('user-stat-new').textContent=userData.filter(function(user){return user.registeredAt.indexOf('2026-08')===0}).length;document.getElementById('user-stat-frozen').textContent=userData.filter(function(user){return user.status==='冻结'}).length}
function userActions(user){return '<div class="table-actions"><button class="btn-link" type="button" data-user-edit="'+user.id+'">编辑</button><button class="btn-link '+(user.status==='冻结'?'':'danger')+'" type="button" data-user-status="'+user.id+'">'+(user.status==='冻结'?'解冻':'冻结')+'</button><button class="btn-link" type="button" data-user-orders="'+user.id+'">查看订单</button></div>'}
function renderUsers(){var pages=Math.max(1,Math.ceil(userFiltered.length/userPageSize));userPage=Math.min(userPage,pages);var pageData=userFiltered.slice((userPage-1)*userPageSize,userPage*userPageSize);document.getElementById('user-tbody').innerHTML=pageData.length?pageData.map(function(user){return '<tr><td><div class="user-name-cell"><span>'+userEscape(user.userName.charAt(0).toUpperCase())+'</span><strong>'+userEscape(user.userName)+'</strong></div></td><td><div class="user-contact-cell"><span>'+userEscape(user.email)+'</span><small>'+userEscape(user.phone)+'</small></div></td><td>'+user.registeredAt+'</td><td>'+user.lastLogin+'</td><td><span class="account-status '+(user.status==='正常'?'normal':'frozen')+'">'+user.status+'</span></td><td class="num"><strong>'+user.orderCount+'</strong></td><td class="num"><strong>'+userMoney(user.totalSpend)+'</strong></td><td class="operation-column">'+userActions(user)+'</td></tr>'}).join(''):'<tr><td colspan="8" class="mark-table-empty">暂无匹配用户</td></tr>';document.getElementById('user-result-count').textContent='共 '+userFiltered.length+' 条';document.getElementById('user-total-count').textContent=userFiltered.length;document.getElementById('user-current').textContent=userPage+' / '+pages;document.getElementById('user-prev').disabled=userPage<=1;document.getElementById('user-next').disabled=userPage>=pages||userFiltered.length===0}
function applyUserFilters(){var keyword=document.getElementById('user-filter-keyword').value.trim().toLowerCase();var type=document.getElementById('user-filter-type').value;var status=document.getElementById('user-filter-status').value;userFiltered=userData.filter(function(user){return (!keyword||(user.userName+' '+user.company).toLowerCase().indexOf(keyword)>-1)&&(!type||user.type===type)&&(!status||user.status===status)});userPage=1;renderUsers()}function resetUserFilters(){document.getElementById('user-filter-keyword').value='';document.getElementById('user-filter-type').value='';document.getElementById('user-filter-status').value='';applyUserFilters()}
function closeUserForm(){document.getElementById('user-form-modal').classList.remove('open')}function openUserForm(id){var user=id?findUser(id):null;document.getElementById('user-form-title').textContent=user?'编辑用户':'手动创建用户';document.getElementById('user-form-submit').textContent=user?'保存修改':'确认创建';document.getElementById('user-form-id').value=user?user.id:'';document.getElementById('user-form-name').value=user?user.userName:'';document.getElementById('user-form-company').value=user?user.company:'';document.getElementById('user-form-type').value=user?user.type:'B2B分销商';document.getElementById('user-form-status').value=user?user.status:'正常';document.getElementById('user-form-email').value=user?user.email:'';document.getElementById('user-form-phone').value=user?user.phone:'';document.getElementById('user-form-modal').classList.add('open');document.getElementById('user-form-name').focus()}
function submitUserForm(){var id=document.getElementById('user-form-id').value;var name=document.getElementById('user-form-name').value.trim();var company=document.getElementById('user-form-company').value.trim();var email=document.getElementById('user-form-email').value.trim();var phone=document.getElementById('user-form-phone').value.trim();if(!name||!company||!email||!phone){showToast('请完整填写用户信息','warning');return}var data={userName:name,company:company,type:document.getElementById('user-form-type').value,status:document.getElementById('user-form-status').value,email:email,phone:phone};if(id){Object.assign(findUser(id),data);showToast('用户信息已更新')}else{userData.unshift(Object.assign({id:'USR-'+Date.now(),registeredAt:'2026-08-27',lastLogin:'尚未登录',orderCount:0,totalSpend:0},data));showToast('用户创建成功')}closeUserForm();updateUserStats();applyUserFilters()}
function closeUserStatus(){document.getElementById('user-status-modal').classList.remove('open');pendingUserStatusId=''}function openUserStatus(id){var user=findUser(id);if(!user)return;pendingUserStatusId=id;var freezing=user.status==='正常';document.getElementById('user-status-title').textContent=freezing?'冻结用户':'解冻用户';document.getElementById('user-status-copy').innerHTML='确认'+(freezing?'冻结':'解冻')+'用户 <strong>'+userEscape(user.userName)+'</strong> 吗？';document.getElementById('user-status-warning').textContent=freezing?'冻结后该用户将无法登录和下单，已存在的订单不会被删除。':'解冻后该用户可恢复登录和下单。';document.getElementById('user-status-confirm').textContent=freezing?'确认冻结':'确认解冻';document.getElementById('user-status-confirm').className='btn '+(freezing?'btn-danger':'btn-primary');document.getElementById('user-status-modal').classList.add('open')}
function submitUserStatus(){var user=findUser(pendingUserStatusId);if(!user)return;user.status=user.status==='正常'?'冻结':'正常';showToast(user.status==='冻结'?'用户已冻结':'用户已解冻');closeUserStatus();updateUserStats();applyUserFilters()}
document.getElementById('user-create').addEventListener('click',function(){openUserForm('')});document.getElementById('user-search').addEventListener('click',applyUserFilters);document.getElementById('user-reset').addEventListener('click',resetUserFilters);document.querySelector('.ops-filter-bar').addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();applyUserFilters()}});document.getElementById('user-prev').addEventListener('click',function(){userPage=Math.max(1,userPage-1);renderUsers()});document.getElementById('user-next').addEventListener('click',function(){userPage++;renderUsers()});document.getElementById('user-tbody').addEventListener('click',function(event){var edit=event.target.closest('[data-user-edit]');if(edit){openUserForm(edit.dataset.userEdit);return}var status=event.target.closest('[data-user-status]');if(status){openUserStatus(status.dataset.userStatus);return}var orders=event.target.closest('[data-user-orders]');if(orders){var user=findUser(orders.dataset.userOrders);location.href='order-management.html?user='+encodeURIComponent(user.userName)}});document.getElementById('user-form-close').addEventListener('click',closeUserForm);document.getElementById('user-form-cancel').addEventListener('click',closeUserForm);document.getElementById('user-form-submit').addEventListener('click',submitUserForm);document.getElementById('user-form-modal').addEventListener('click',function(event){if(event.target===this)closeUserForm()});document.getElementById('user-status-close').addEventListener('click',closeUserStatus);document.getElementById('user-status-cancel').addEventListener('click',closeUserStatus);document.getElementById('user-status-confirm').addEventListener('click',submitUserStatus);document.getElementById('user-status-modal').addEventListener('click',function(event){if(event.target===this)closeUserStatus()});document.addEventListener('keydown',function(event){if(event.key==='Escape'){closeUserForm();closeUserStatus()}});updateUserStats();applyUserFilters();
</script><script src="toast.js?v=20260828-cart-action"></script><script src="role-switch.js"></script><script src="notes.js?v=20260828-all-prd"></script>
</body></html>
