<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>费用明细 - 美国货盘PRD</title>
<link rel="stylesheet" href="styles.css?v=20260828-returns-pagination">
<script src="navigation.js?v=20260901-auth-state" defer></script>
</head><body data-page="fees">
<aside class="app-nav"><div class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>美国货盘PRD</div><nav class="nav-list"></nav><div class="nav-footer">美国货盘PRD</div></aside>
<div class="app-content">
  <div class="topbar"><div class="topbar-left"><h1>费用明细</h1></div><div class="topbar-right"><div class="user"><button class="avatar" type="button" data-role-avatar aria-haspopup="dialog" aria-label="切换身份" title="切换身份">超</button></div></div></div>
  <main class="page-body ops-page-body">
    <section class="fee-summary page-section" aria-label="费用统计">
      <div class="stat-card fee-stat fee-stat-total"><div class="stat-heading"><div class="stat-label">本月费用</div><p>本月全部费用金额</p></div><div class="stat-metric-row"><div class="stat-value fee-amount" id="fee-stat-total">$0</div><div class="stat-trend trend-up"><strong>↑ 11.6%</strong><span>vs 上月同期</span></div></div></div>
      <div class="stat-card fee-stat fee-stat-pending"><div class="stat-heading"><div class="stat-label">待结算</div><p>尚未完成结算的金额</p></div><div class="stat-metric-row"><div class="stat-value fee-amount" id="fee-stat-pending">$0</div><div class="stat-trend trend-up"><strong>↑ 8.3%</strong><span>vs 上月同期</span></div></div></div>
      <div class="stat-card fee-stat fee-stat-settled"><div class="stat-heading"><div class="stat-label">已结算</div><p>本月已完成结算金额</p></div><div class="stat-metric-row"><div class="stat-value fee-amount" id="fee-stat-settled">$0</div><div class="stat-trend trend-up"><strong>↑ 19.2%</strong><span>vs 上月同期</span></div></div></div>
      <div class="stat-card fee-stat fee-stat-orders"><div class="stat-heading"><div class="stat-label">费用单</div><p>本月生成费用单数量</p></div><div class="stat-metric-row"><div class="stat-value" id="fee-stat-orders">0</div><div class="stat-trend trend-up"><strong>↑ 5.0%</strong><span>vs 上月</span></div></div></div>
    </section>
    <section class="filter-bar page-section" aria-label="费用筛选">
      <div class="filter-group"><label for="fee-id">费用单号</label><input id="fee-id" type="text" placeholder="请输入费用单号" autocomplete="off"></div>
      <div class="filter-group"><label for="fee-type">费用类型</label><select id="fee-type"><option value="">全部类型</option><option>操作费</option><option>包材费</option><option>物流费</option><option>仓租费</option></select></div>
      <div class="filter-group"><label for="fee-item">费用项目</label><select id="fee-item"><option value="">全部项目</option><option>仓租费</option><option>退货销毁费</option><option>退货贴标</option><option>退货入库处理费</option></select></div>
      <div class="filter-group"><label for="fee-status">结算状态</label><select id="fee-status"><option value="">全部状态</option><option>待结算</option><option>已结算</option><option>已冲销</option></select></div>
      <div class="spacer"></div><button class="btn btn-primary" id="fee-search" type="button">搜索</button><button class="btn btn-ghost" id="fee-reset" type="button">重置</button>
    </section>
    <section class="table-wrap ops-table-wrap page-section">
      <div class="table-head-bar"><h3>费用明细</h3><span class="tag tag-muted" id="fee-count">共 0 条</span></div>
      <div class="table-scroll"><table class="data-table fee-table fee-grouped-table"><thead><tr><th class="fee-id-column">费用单号</th><th>费用类型</th><th>费用项目</th><th class="sku-column">SKU</th><th>计费说明</th><th>单价</th><th>计费数量</th><th>倍率</th><th>金额</th><th>币种</th><th>计费日期</th><th>结算状态</th><th>备注</th></tr></thead><tbody id="fee-tbody"></tbody></table></div>
      <div class="pagination"><span class="pagination-info">共 <strong id="fee-total-count">0</strong> 条费用单</span><div class="pagination-btns"><button class="page-btn" id="fee-prev" type="button">‹</button><button class="page-btn active" id="fee-current" type="button">1 / 1</button><button class="page-btn" id="fee-next" type="button">›</button></div></div>
    </section>
  </main>
</div>
<script src="sku-data.js"></script>
<script>
var feeTypes=['操作费','包材费','物流费','仓租费'];
var feeItems=['退货入库处理费','退货贴标','退货销毁费','仓租费'];
var feeDescriptions=['退货接收入库，含处理及上架','退货商品重新贴标及耗材','不可售退货转运及销毁处理','可售库存月度仓储计费'];
var feePrices=[3.2,.5,4,.65];
var feeData=[];var feeSkus=(window.OMS_SKU_DATA||[]);
for(var feeIndex=0;feeIndex<24;feeIndex++){
  var lineCount=2+(feeIndex%2);var lines=[];
  for(var lineIndex=0;lineIndex<lineCount;lineIndex++){
    var kind=(feeIndex+lineIndex)%4;var quantity=20+((feeIndex*37+lineIndex*19)%180);var sku=feeSkus[(feeIndex*5+lineIndex*13)%feeSkus.length];
    lines.push({type:feeTypes[kind],item:feeItems[kind],sku:sku.barcode,description:feeDescriptions[kind],unitPrice:feePrices[kind],quantity:quantity,multiplier:1,amount:feePrices[kind]*quantity,remark:kind===2?'含销毁证明':kind===3?'按库龄区间计费':'费用已核对'});
  }
  feeData.push({id:'FEE-202608-'+String(feeIndex+1).padStart(3,'0'),date:'2026-08-'+String(27-feeIndex%24).padStart(2,'0'),status:feeIndex%4===0?'已结算':'待结算',currency:'USD',lines:lines});
}
feeData.slice(0,3).forEach(function(original,index){feeData.push({id:'REV-202608-'+String(index+1).padStart(3,'0'),originalFeeId:original.id,date:'2026-08-'+String(28-index).padStart(2,'0'),status:'已冲销',currency:'USD',lines:original.lines.map(function(line){return Object.assign({},line,{unitPrice:-Math.abs(line.unitPrice),amount:-Math.abs(line.amount),remark:'冲销原费用单 '+original.id+'；保留原费用及本次冲销记录'})})})});
var feeFiltered=feeData.slice();var feePage=1;var feePageSize=8;
function feeEscape(value){return String(value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}
function feeMoney(value){var amount=Number(value||0);return (amount<0?'-$':'$')+Math.abs(amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function feeStack(values,formatter){return '<div class="fee-cell-stack">'+values.map(function(value){return '<span>'+feeEscape(formatter?formatter(value):value)+'</span>'}).join('')+'</div>'}
function feeTotal(bill){return bill.lines.reduce(function(sum,line){return sum+line.amount},0)}
function updateFeeStats(){var total=feeData.reduce(function(sum,bill){return sum+feeTotal(bill)},0);var settled=feeData.filter(function(bill){return bill.status==='已结算'}).reduce(function(sum,bill){return sum+feeTotal(bill)},0);var pending=feeData.filter(function(bill){return bill.status==='待结算'}).reduce(function(sum,bill){return sum+feeTotal(bill)},0);document.getElementById('fee-stat-total').textContent=feeMoney(total);document.getElementById('fee-stat-pending').textContent=feeMoney(pending);document.getElementById('fee-stat-settled').textContent=feeMoney(settled);document.getElementById('fee-stat-orders').textContent=feeData.length}
function renderFees(){var pages=Math.max(1,Math.ceil(feeFiltered.length/feePageSize));feePage=Math.min(feePage,pages);var pageData=feeFiltered.slice((feePage-1)*feePageSize,feePage*feePageSize);document.getElementById('fee-tbody').innerHTML=pageData.length?pageData.map(function(bill){var lines=bill.lines;var statusClass=bill.status==='已结算'?'tag-success':bill.status==='已冲销'?'tag-muted':'tag-warning';return '<tr><td class="fee-id-column"><code>'+bill.id+'</code><small>'+(bill.originalFeeId?'原单 '+bill.originalFeeId:lines.length+' 个费用项')+'</small></td><td>'+feeStack(lines.map(function(line){return line.type}))+'</td><td>'+feeStack(lines.map(function(line){return line.item}))+'</td><td class="sku-column">'+feeStack(lines.map(function(line){return line.sku}))+'</td><td>'+feeStack(lines.map(function(line){return line.description}))+'</td><td>'+feeStack(lines.map(function(line){return line.unitPrice}),function(value){return Number(value).toFixed(2)})+'</td><td>'+feeStack(lines.map(function(line){return line.quantity}),function(value){return Number(value).toLocaleString('en-US')})+'</td><td>'+feeStack(lines.map(function(line){return line.multiplier}),function(value){return Number(value).toFixed(2)})+'</td><td><strong>'+feeMoney(feeTotal(bill))+'</strong></td><td>'+bill.currency+'</td><td>'+bill.date+'</td><td><span class="tag '+statusClass+'">'+bill.status+'</span></td><td>'+feeStack(lines.map(function(line){return line.remark}))+'</td></tr>'}).join(''):'<tr><td colspan="13" class="mark-table-empty">暂无匹配费用单</td></tr>';document.getElementById('fee-count').textContent='共 '+feeFiltered.length+' 条费用单';document.getElementById('fee-total-count').textContent=feeFiltered.length;document.getElementById('fee-current').textContent=feePage+' / '+pages;document.getElementById('fee-prev').disabled=feePage<=1;document.getElementById('fee-next').disabled=feePage>=pages||feeFiltered.length===0}
function applyFeeFilters(){var id=document.getElementById('fee-id').value.trim().toLowerCase();var type=document.getElementById('fee-type').value;var item=document.getElementById('fee-item').value;var status=document.getElementById('fee-status').value;feeFiltered=feeData.filter(function(bill){return (!id||bill.id.toLowerCase().indexOf(id)>-1)&&(!status||bill.status===status)&&bill.lines.some(function(line){return (!type||line.type===type)&&(!item||line.item===item)})});feePage=1;renderFees()}
function resetFeeFilters(){document.getElementById('fee-id').value='';document.getElementById('fee-type').value='';document.getElementById('fee-item').value='';document.getElementById('fee-status').value='';applyFeeFilters()}
document.getElementById('fee-search').addEventListener('click',applyFeeFilters);document.getElementById('fee-reset').addEventListener('click',resetFeeFilters);document.querySelector('[aria-label="费用筛选"]').addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();applyFeeFilters()}});document.getElementById('fee-prev').addEventListener('click',function(){feePage=Math.max(1,feePage-1);renderFees()});document.getElementById('fee-next').addEventListener('click',function(){feePage++;renderFees()});updateFeeStats();renderFees();
</script>
<script src="toast.js?v=20260828-cart-action"></script><script src="role-switch.js"></script><script src="notes.js?v=20260828-local-prd-v2"></script>
</body></html>
