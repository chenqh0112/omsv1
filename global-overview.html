<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>全局说明 — 美国货盘PRD</title>
  <link rel="stylesheet" href="styles.css?v=20260907-global-overview-image">
  <script src="navigation.js?v=20260901-auth-state" defer></script>
</head>
<body data-page="global-overview">
<aside class="app-nav">
  <div class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>美国货盘PRD</div>
  <nav class="nav-list"></nav>
  <div class="nav-footer">美国货盘PRD</div>
</aside>

<div class="app-content">
  <div class="topbar">
    <div class="topbar-left"><h1>全局说明</h1></div>
    <div class="topbar-right"><div class="user"><button class="avatar" type="button" data-role-avatar aria-haspopup="dialog" aria-label="切换身份" title="切换身份">超</button></div></div>
  </div>
  <main class="page-body global-overview-body">
    <section class="global-overview-image page-section" aria-label="平台订单导入流程图">
      <button class="global-overview-image-trigger" id="global-overview-image-trigger" type="button" aria-label="放大查看平台订单导入流程图">
        <img src="assets/订单导入.png" alt="平台订单导入流程图">
      </button>
    </section>
  </main>
</div>

<div class="global-image-preview" id="global-image-preview" role="dialog" aria-modal="true" aria-label="平台订单导入流程图原图" hidden>
  <button class="global-image-preview-close" id="global-image-preview-close" type="button" aria-label="关闭原图预览" title="关闭">&times;</button>
  <img src="assets/订单导入.png" alt="平台订单导入流程图原图">
</div>

<script src="toast.js?v=20260828-cart-action"></script>
<script src="role-switch.js"></script>
<script src="notes.js?v=20260828-local-prd-v2"></script>
<script>
(function(){
  var trigger=document.getElementById('global-overview-image-trigger');
  var preview=document.getElementById('global-image-preview');
  var closeButton=document.getElementById('global-image-preview-close');
  function closePreview(){preview.hidden=true}
  trigger.addEventListener('click',function(){preview.hidden=false;closeButton.focus()});
  closeButton.addEventListener('click',closePreview);
  preview.addEventListener('click',function(event){if(event.target===preview)closePreview()});
  document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!preview.hidden)closePreview()});
})();
</script>
</body>
</html>
